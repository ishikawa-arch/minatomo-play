function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ========== SVG LANDSCAPE RENDERER ==========

// Card content dispatcher
function CardContent({ card }) {
  if (card.type === 'emoji') return <span>{card.content}</span>;
  if (card.type === 'shape') return <ShapeCard shape={card.shape} color={card.color} />;
  if (card.type === 'landscape') return <LandscapeCard data={card.data} />;
  if (card.type === 'face') return <FaceCard data={card.data} />;
  return null;
}

function ShapeCard({ shape, color }) {
  const clips = { star:'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)', heart:'polygon(50% 85%,5% 40%,5% 20%,25% 0%,50% 15%,75% 0%,95% 20%,95% 40%)', cross:'polygon(35% 0%,65% 0%,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0% 65%,0% 35%,35% 35%)', hexagon:'polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)' };
  const styles = { circle:{width:'60%',height:'60%',borderRadius:'50%',background:color}, square:{width:'60%',height:'60%',borderRadius:'16%',background:color}, diamond:{width:'48%',height:'48%',borderRadius:'12%',background:color,transform:'rotate(45deg)'}, oval:{width:'48%',height:'68%',borderRadius:'50%',background:color}, triangle:{width:0,height:0,borderLeft:'28px solid transparent',borderRight:'28px solid transparent',borderBottom:`48px solid ${color}`,background:'none'}, moon:{width:44,height:44,borderRadius:'50%',boxShadow:`inset 12px 0 0 0 ${color}`} };
  if (clips[shape]) return <div style={{width:'60%',height:'60%',background:color,clipPath:clips[shape]}} />;
  return <div style={styles[shape]||styles.circle} />;
}

function generateDeck(type, pairCount) {
  let items = [];
  if (type === 'emoji') {
    items = shuffle(EMOJI_SETS).slice(0,pairCount).map(e => ({key:e, type:'emoji', content:e}));
  } else if (type === 'color') {
    const colors = shuffle(SHAPE_COLORS).slice(0,pairCount);
    const shapes = shuffle(SHAPE_TYPES);
    items = colors.map((c,i) => ({key:c+shapes[i%shapes.length], type:'shape', shape:shapes[i%shapes.length], color:c}));
  } else if (type === 'landscape') {
    items = shuffle(LANDSCAPES).slice(0,pairCount).map(ls => ({key:ls.id, type:'landscape', data:ls}));
  } else if (type === 'face') {
    items = shuffle(FACES).slice(0,pairCount).map(f => ({key:f.id, type:'face', data:f}));
  }
  const deck = [];
  items.forEach((item, idx) => { deck.push({...item, uid:idx+'a'}); deck.push({...item, uid:idx+'b'}); });
  return shuffle(deck);
}

function Confetti({ active }) {
  if (!active) return null;
  const p = Array.from({length:50},(_,i) => ({id:i, left:Math.random()*100, color:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], delay:Math.random()*1.5, dur:2+Math.random()*2, size:6+Math.random()*8, round:Math.random()>0.5}));
  return <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:999,overflow:'hidden'}}>
    <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
        @media (min-width: 768px) {
          #root { zoom: 1.25; }
        }
        @media (min-width: 1200px) {
          #root { zoom: 1.8; }
        }
        @media (min-width: 1920px) {
          #root { zoom: 2.4; }
        }
`}</style>
    {p.map(x=><div key={x.id} style={{position:'absolute',top:-10,left:x.left+'%',width:x.size,height:x.size,background:x.color,borderRadius:x.round?'50%':2,animation:`cf ${x.dur}s linear ${x.delay}s forwards`}}/>)}
  </div>;
}

function App() {
  const [screen, setScreen] = React.useState('select');
  const [cardType, setCardType] = React.useState('emoji');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [deck, setDeck] = React.useState([]);
  const [flipped, setFlipped] = React.useState([]);
  const [matched, setMatched] = React.useState(new Set());
  const [moves, setMoves] = React.useState(0);
  const [seconds, setSeconds] = React.useState(0);
  const [locked, setLocked] = React.useState(false);
  const [progressMsg, setProgressMsg] = React.useState('');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [score, setScore] = React.useState(0);
  const [stars, setStars] = React.useState('');
  const [history, setHistory] = React.useState([]);
  const [previewing, setPreviewing] = React.useState(false);
  const timerRef = React.useRef(null);
  const movesRef = React.useRef(0);
  const secondsRef = React.useRef(0);

  React.useEffect(() => { movesRef.current = moves; }, [moves]);
  React.useEffect(() => { secondsRef.current = seconds; }, [seconds]);

  React.useEffect(() => {
    if (screen === 'game' && !previewing) {
      timerRef.current = setInterval(() => setSeconds(s => s + 1), 1000);
      return () => clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [screen, previewing]);

  const totalPairs = DIFF[difficulty]?.pairs || 6;

  const startGame = React.useCallback((diff) => {
    setDifficulty(diff);
    const d = generateDeck(cardType, DIFF[diff].pairs);
    setDeck(d); setFlipped([]); setMatched(new Set()); setMoves(0); setSeconds(0);
    setLocked(false); setProgressMsg(''); setShowConfetti(false); setScreen('game');
    if (diff === 'easy') {
      setPreviewing(true); setLocked(true);
      setTimeout(() => { setPreviewing(false); setLocked(false); }, 2000);
    }
  }, [cardType]);

  const handleFlip = React.useCallback((index) => {
    if (locked || flipped.includes(index) || matched.has(deck[index]?.key)) return;
    const nf = [...flipped, index];
    setFlipped(nf);
    if (nf.length === 2) {
      setMoves(m => m + 1);
      setLocked(true);
      const [a, b] = nf;
      if (deck[a].key === deck[b].key) {
        setTimeout(() => {
          setMatched(prev => {
            const next = new Set(prev); next.add(deck[a].key);
            if (next.size === DIFF[difficulty].pairs) setTimeout(() => completeGame(), 400);
            return next;
          });
          setProgressMsg(MSGS[Math.floor(Math.random() * MSGS.length)]);
          setTimeout(() => setProgressMsg(''), 1500);
          setFlipped([]); setLocked(false);
        }, 400);
      } else {
        setTimeout(() => { setFlipped([]); setLocked(false); }, 1000);
      }
    }
  }, [locked, flipped, matched, deck, difficulty]);

  const completeGame = React.useCallback(() => {
    clearInterval(timerRef.current);
    const m = movesRef.current, s = secondsRef.current;
    const pairs = DIFF[difficulty].pairs;
    const ratio = pairs / Math.max(m, 1);
    const tb = Math.max(0, 300 - s * 2);
    const dm = difficulty === 'hard' ? 1.5 : difficulty === 'normal' ? 1 : 0.7;
    const sc = Math.round((ratio * 800 + tb) * dm);
    const st = ratio >= 0.8 ? '⭐⭐⭐' : ratio >= 0.5 ? '⭐⭐' : '⭐';
    setScore(sc); setStars(st); setShowConfetti(true); setScreen('result');
    setTimeout(() => setShowConfetti(false), 4000);
    setHistory(prev => [{ diff:difficulty, type:cardType, moves:m, time:s, score:sc, stars:st, date:new Date().toISOString() }, ...prev].slice(0,20));
  }, [difficulty, cardType]);

  const goBack = () => { clearInterval(timerRef.current); setScreen('select'); };
  const cfg = DIFF[difficulty] || DIFF.normal;
  const typeInfo = TYPE_INFO[cardType];

  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF8', minHeight:'100vh', color:'#333' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes matchPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 1px 4px rgba(0,0,0,0.03)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px', borderRadius:8 }}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#E8652E', letterSpacing:'0.08em' }}>🃏 記憶マッチング</span>
        </div>
        {screen === 'game' && <div style={{ display:'flex', gap:6 }}>
          <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#888', padding:'3px 10px', borderRadius:50 }}>{typeInfo.label}</span>
          <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#888', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
        </div>}
      </div>

      {/* STATUS */}
      {screen === 'game' && <div style={{ display:'flex', justifyContent:'center', gap:24, padding:'14px 20px', background:'white', borderBottom:'1px solid #F0F0F0' }}>
        {[{v:matched.size+'/'+totalPairs, l:'マッチ', c:'#FF6B35'}, {v:moves, l:'タップ数', c:'#2EC4B6'}, {v:formatTime(seconds), l:'時間', c:'#FF6B35'}].map((s,i) =>
          <div key={i} style={{textAlign:'center'}}><div style={{fontFamily:'Outfit',fontSize:24,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:10,color:'#9E9E9E',marginTop:2}}>{s.l}</div></div>
        )}
      </div>}

      {/* SELECT */}
      {screen === 'select' && <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
        <div style={{ fontSize:64, marginBottom:16, animation:'bounce 3s ease-in-out infinite' }}>🃏</div>
        <div style={{ fontSize:24, fontWeight:900, color:'#E8652E', letterSpacing:'0.1em', marginBottom:6 }}>記憶マッチング</div>
        <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:28, lineHeight:1.9 }}>カードをめくって同じペアを見つけよう！<br/>カードの種類と難易度を選んでスタート。</div>

        <div style={{ width:'100%', maxWidth:480, marginBottom:28 }}>
          <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>🎴 カードの種類</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10 }}>
            {Object.entries(TYPE_INFO).map(([k,info]) => (
              <button key={k} onClick={() => setCardType(k)} style={{...btnBase, padding:'14px 10px', borderRadius:16, border:`3px solid ${cardType===k?'#2EC4B6':'#E8E8E8'}`, background:cardType===k?'#E0F7FA':'white', textAlign:'center' }}>
                <div style={{ fontSize:28, marginBottom:4 }}>{info.icon}</div>
                <div style={{ fontSize:16, fontWeight:700 }}>{info.label}</div>
                <div style={{ fontSize:10, color:'#6B6B6B', marginTop:2 }}>{info.desc}</div>
              </button>
            ))}
          </div>
        </div>

        <div style={{ width:'100%', maxWidth:480 }}>
          <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度</div>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {Object.entries(DIFF).map(([k,d]) => (
              <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'2px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left' }}>
                <span style={{ fontSize:26 }}>{d.emoji}</span>
                <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
              </button>
            ))}
          </div>
        </div>

        {history.length > 0 && <div style={{ width:'100%', maxWidth:480, marginTop:32, textAlign:'left' }}>
          <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
          {history.slice(0,5).map((h,i) => {
            const hc = DIFF[h.diff], ht = TYPE_INFO[h.type]||{label:'?'};
            const d = new Date(h.date);
            return <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 2px 8px rgba(0,0,0,0.04)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                <div><div style={{fontSize:12,fontWeight:700}}>{ht.label}・{hc.label}</div><div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div></div>
              </div>
              <div style={{textAlign:'right'}}><div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#E8652E'}}>{h.score}pt</div><div style={{fontSize:10,color:'#9E9E9E'}}>{h.stars} {formatTime(h.time)}</div></div>
            </div>;
          })}
        </div>}
      </div>}

      {/* GAME */}
      {screen === 'game' && <div>
        <div style={{ textAlign:'center', padding:6, fontSize:14, fontWeight:700, color:'#2EC4B6', minHeight:32, opacity:progressMsg?1:0, transition:'opacity 0.3s' }}>{progressMsg||'\u00A0'}</div>
        <div style={{ padding:12, maxWidth:600, margin:'0 auto' }}>
          <div style={{ display:'grid', gridTemplateColumns:`repeat(${cfg.cols},1fr)`, gap:cfg.cols<=2?12:cfg.cols>=5?6:10, maxWidth:cfg.cols===2?280:undefined, margin:cfg.cols===2?'0 auto':undefined }}>
            {deck.map((card, i) => {
              const isFlipped = flipped.includes(i) || matched.has(card.key) || previewing;
              const isMatched = matched.has(card.key);
              return <div key={card.uid+i} onClick={() => handleFlip(i)} style={{ aspectRatio:'1', borderRadius:16, cursor:'pointer', perspective:800, WebkitTapHighlightColor:'transparent' }}>
                <div style={{ width:'100%', height:'100%', transition:'transform 0.5s cubic-bezier(0.4,0,0.2,1)', transformStyle:'preserve-3d', position:'relative', transform:isFlipped?'rotateY(180deg)':'rotateY(0deg)', animation:isMatched?'matchPop 0.4s ease-out':undefined }}>
                  <div style={{ position:'absolute', inset:0, borderRadius:16, display:'flex', alignItems:'center', justifyContent:'center', backfaceVisibility:'hidden', WebkitBackfaceVisibility:'hidden', background:'linear-gradient(135deg,#FF6B35,#FF8F5E)', boxShadow:'0 4px 16px rgba(255,107,53,0.2)', fontFamily:'Outfit', fontWeight:800, fontSize:cfg.cols===2?36:28, color:'rgba(255,255,255,0.5)' }}>?</div>
                  <div style={{ position:'absolute', inset:0, borderRadius:16, display:'flex', alignItems:'center', justifyContent:'center', backfaceVisibility:'hidden', WebkitBackfaceVisibility:'hidden', transform:'rotateY(180deg)', background:isMatched?'#F1F8E9':'white', border:`3px solid ${isMatched?'#66BB6A':'#E8E8E8'}`, boxShadow:'0 4px 16px rgba(0,0,0,0.06)', fontSize:cfg.cols===2?52:40, overflow:'hidden' }}>
                    <CardContent card={card} />
                  </div>
                </div>
              </div>;
            })}
          </div>
        </div>
      </div>}

      {/* RESULT */}
      {screen === 'result' && <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'calc(100vh - 56px)', padding:'30px 20px', textAlign:'center' }}>
        <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
        <div style={{ fontSize:24, fontWeight:900, color:'#E8652E', letterSpacing:'0.1em', marginBottom:8, animation:'fadeUp 0.6s ease-out 0.1s both' }}>{stars==='⭐⭐⭐'?'すばらしい！':stars==='⭐⭐'?'よくできました！':'クリア！'}</div>
        <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:28, animation:'fadeUp 0.6s ease-out 0.2s both' }}>{typeInfo.label}・{cfg.label}モード・全{totalPairs}ペアクリア</div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:32, animation:'fadeUp 0.6s ease-out 0.3s both' }}>
          {[{v:moves,l:'タップ数'},{v:formatTime(seconds),l:'クリアタイム'},{v:score,l:'スコア'}].map((s,i) =>
            <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 2px 8px rgba(0,0,0,0.04)', textAlign:'center' }}>
              <div style={{ fontFamily:'Outfit', fontSize:26, fontWeight:800, color:'#E8652E' }}>{s.v}</div>
              <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
            </div>
          )}
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300, animation:'fadeUp 0.6s ease-out 0.4s both' }}>
          <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60 }}>もう一度プレイ 🔄</button>
          <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60 }}>設定を変える</button>
        </div>
      </div>}

      <Confetti active={showConfetti} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
