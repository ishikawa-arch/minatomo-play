<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>おぼえてね | みなともPlay</title>
<meta name="description" content="おぼえてね - 無料リハビリゲーム みなともPlay">
<meta name="minatomo-domain" content="memory">
<meta name="minatomo-category" content="シンプル">
<meta name="minatomo-source" content="jsx-build-20260425T100701">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
<meta name="minatomo-id" content="minatomo-simple-memory">
<meta name="minatomo-domain-primary" content="memory">
<meta name="minatomo-domain-subdomains" content="visual_memory">
<meta name="minatomo-target" content="moderate_dementia,mild_dementia,stroke_chronic">
<meta name="minatomo-difficulty-levels" content="1,2,3">
<meta name="minatomo-duration" content="3">
<meta name="minatomo-completion-status" content="auto_filled">
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">

// ========== 【シンプル】おぼえてね ==========
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

const ALL_EMOJIS = ['🍎','🐱','⭐','🌸','🚗','🎈','🐟','🍰','☀️','🐸','❤️','🍊','🎵','🐧','🌻','🍇','🐶','🎁'];

function genRounds(count) {
  const rounds = [];
  for (let i = 0; i < count; i++) {
    // Gradually increase: 1 item → 2 → 3
    let showCount;
    if (i < 4) showCount = 1;
    else if (i < 8) showCount = 2;
    else showCount = 3;

    const pool = shuffle([...ALL_EMOJIS]);
    const targets = pool.slice(0, showCount);
    const distractors = pool.slice(showCount, showCount + 4 - showCount);
    // Choices: targets + distractors, shuffled
    const choices = shuffle([...targets, ...distractors]);

    // Display time: longer for more items
    const showTime = 1500 + showCount * 500;

    rounds.push({ targets, choices, showCount, showTime });
  }
  return rounds;
}

function App() {
  const [screen, setScreen] = React.useState('start');
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    rounds: [], currentR: 0, score: 0, correct: 0,
    phase: 'idle', // showing, picking, feedback
    picked: new Set(),
    feedback: null,
  }).current;

  const timerRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(timerRef.current), []);

  const startGame = () => {
    g.rounds = genRounds(12);
    g.currentR = 0; g.score = 0; g.correct = 0;
    g.phase = 'idle'; g.picked = new Set(); g.feedback = null;
    setScreen('play');
    rerender();
    showRound();
  };

  const showRound = () => {
    g.phase = 'showing';
    g.picked = new Set();
    g.feedback = null;
    rerender();
    const round = g.rounds[g.currentR];
    timerRef.current = setTimeout(() => {
      g.phase = 'picking';
      rerender();
    }, round.showTime);
  };

  const handleTap = (emoji) => {
    if (g.phase !== 'picking' || g.picked.has(emoji)) return;
    const round = g.rounds[g.currentR];
    g.picked.add(emoji);
    rerender();

    // Check if all targets found
    const allFound = round.targets.every(t => g.picked.has(t));
    const wrongPick = !round.targets.includes(emoji);

    if (wrongPick) {
      // Wrong!
      g.feedback = 'wrong';
      rerender();
      timerRef.current = setTimeout(nextRound, 1500);
    } else if (allFound) {
      // All correct!
      g.feedback = 'correct';
      g.correct++;
      g.score += 10 * round.showCount;
      rerender();
      timerRef.current = setTimeout(nextRound, 800);
    }
    // If correct but not all found yet, wait for more picks
  };

  const nextRound = () => {
    g.currentR++;
    if (g.currentR >= g.rounds.length) {
      setScreen('done');
      rerender();
    } else {
      showRound();
    }
  };

  const round = g.currentR < g.rounds.length ? g.rounds[g.currentR] : null;
  const bs = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.15s' };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF8', minHeight:'100vh', color:'#333' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop{0%{transform:scale(0.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(232,101,46,0.4)}50%{box-shadow:0 0 0 16px rgba(232,101,46,0)}}
        @media(min-width:768px){#root{zoom:1.25}}@media(min-width:1200px){#root{zoom:1.8}}@media(min-width:1920px){#root{zoom:2.4}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'10px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 1px 4px rgba(0,0,0,0.03)' }}>
        <span style={{ fontSize:18, fontWeight:900, color:'#E8652E', letterSpacing:'0.08em' }}>🧠 おぼえてね</span>
        {screen === 'play' && (
          <span style={{ fontSize:14, fontWeight:800, color:'white', background:'#888', padding:'4px 12px', borderRadius:50 }}>{g.currentR + 1} / {g.rounds.length}</span>
        )}
      </div>

      {/* ===== START ===== */}
      {screen === 'start' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
          {/* Visual demo */}
          <div style={{ display:'flex', gap:16, marginBottom:12 }}>
            <span style={{ fontSize:56 }}>🍎</span>
            <span style={{ fontSize:56 }}>🐱</span>
          </div>
          <div style={{ fontSize:20, color:'#9E9E9E', marginBottom:8 }}>↓</div>
          <div style={{ fontSize:18, fontWeight:700, color:'#E8652E', marginBottom:28 }}>なにがいた？</div>

          <div style={{ fontSize:26, fontWeight:900, color:'#333', marginBottom:8, letterSpacing:'0.06em', lineHeight:1.6 }}>
            おぼえてタップ！
          </div>
          <div style={{ fontSize:16, color:'#9E9E9E', marginBottom:40 }}>
            でてきたものをおぼえよう
          </div>

          <button onClick={startGame} style={{
            ...bs, fontSize:28, fontWeight:900, color:'white',
            background:'#E8652E', border:'none',
            padding:'24px 64px', borderRadius:60,
            letterSpacing:'0.1em',
            boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
          }}>
            はじめる
          </button>
        </div>
      )}

      {/* ===== PLAY ===== */}
      {screen === 'play' && round && (
        <div style={{ padding:'16px', maxWidth:580, margin:'0 auto' }}>

          {/* Progress dots */}
          <div style={{ display:'flex', gap:3, justifyContent:'center', marginBottom:12 }}>
            {g.rounds.map((_, i) => (
              <div key={i} style={{
                width: i === g.currentR ? 12 : 8, height: 8, borderRadius: 4,
                background: i < g.currentR ? '#8BC34A' : i === g.currentR ? '#E8652E' : '#E0E0E0',
              }} />
            ))}
          </div>

          {/* Score */}
          <div style={{ textAlign:'center', marginBottom:12 }}>
            <span style={{ fontFamily:'Outfit,sans-serif', fontSize:24, fontWeight:900, color:'#E8652E' }}>{g.score}</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#9E9E9E', marginLeft:4 }}>てん</span>
          </div>

          {/* SHOWING phase */}
          {g.phase === 'showing' && (
            <div style={{ textAlign:'center', animation:'fadeUp 0.3s ease-out' }} key={'show-' + g.currentR}>
              <div style={{ fontSize:22, fontWeight:900, color:'#E8652E', marginBottom:20 }}>
                おぼえてね！
              </div>
              <div style={{ display:'flex', gap:16, justifyContent:'center', flexWrap:'wrap' }}>
                {round.targets.map((emoji, i) => (
                  <div key={i} style={{
                    width:100, height:100, borderRadius:20,
                    background:'white', border:'4px solid #E8652E',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    boxShadow:'0 4px 16px rgba(232,101,46,0.2)',
                    animation:'glow 1.5s ease-in-out infinite',
                  }}>
                    <span style={{ fontSize:56, lineHeight:1 }}>{emoji}</span>
                  </div>
                ))}
              </div>
              <div style={{ marginTop:16, fontSize:14, color:'#9E9E9E' }}>
                {round.showCount === 1 ? 'ひとつ おぼえてね' : round.showCount + 'つ おぼえてね'}
              </div>
            </div>
          )}

          {/* PICKING phase */}
          {g.phase === 'picking' && (
            <div style={{ textAlign:'center', animation:'fadeUp 0.3s ease-out' }} key={'pick-' + g.currentR}>
              <div style={{ fontSize:20, fontWeight:900, color:'#333', marginBottom:6 }}>
                どれがいた？
              </div>
              {round.showCount > 1 && (
                <div style={{ fontSize:14, color:'#9E9E9E', marginBottom:12 }}>
                  {round.showCount}つ えらんでね
                  {g.picked.size > 0 && (
                    <span style={{ marginLeft:8, fontWeight:700, color:'#E8652E' }}>（あと{round.showCount - g.picked.size}つ）</span>
                  )}
                </div>
              )}
              {round.showCount <= 1 && <div style={{ height:14, marginBottom:12 }} />}

              {/* Feedback */}
              {g.feedback && (
                <div style={{ marginBottom:8, animation:'fadeUp 0.2s ease-out' }}>
                  <span style={{ fontSize:52 }}>{g.feedback === 'correct' ? '⭕' : '❌'}</span>
                </div>
              )}
              {!g.feedback && <div style={{ height:60 }} />}

              {/* Choices */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:12, maxWidth:320, margin:'0 auto' }}>
                {round.choices.map((emoji, i) => {
                  const isPicked = g.picked.has(emoji);
                  const isTarget = round.targets.includes(emoji);
                  const showCorrect = g.feedback && isTarget;
                  const showWrong = g.feedback === 'wrong' && isPicked && !isTarget;

                  return (
                    <button key={i} onClick={() => handleTap(emoji)}
                      style={{
                        ...bs,
                        height:100, borderRadius:20,
                        background: showCorrect ? '#F1F8E9' : showWrong ? '#FFF5F5' : isPicked ? '#F5F5F0' : 'white',
                        border: `4px solid ${showCorrect ? '#66BB6A' : showWrong ? '#EF5350' : isPicked ? '#66BB6A' : '#E8E8E8'}`,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        animation: showWrong ? 'shake 0.3s' : showCorrect ? 'pop 0.3s' : undefined,
                        opacity: g.feedback && !showCorrect && !showWrong && !isPicked ? 0.3 : 1,
                        boxShadow: '0 2px 8px rgba(0,0,0,0.04)',
                        pointerEvents: g.feedback || isPicked ? 'none' : 'auto',
                      }}>
                      <span style={{ fontSize:48, lineHeight:1 }}>{emoji}</span>
                      {isPicked && !g.feedback && <span style={{ position:'absolute', fontSize:20, top:4, right:8 }}>✓</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      {/* ===== DONE ===== */}
      {screen === 'done' && (() => {
        const total = g.rounds.length;
        const pct = g.correct / total;
        const emoji = pct >= 0.8 ? '🎉' : pct >= 0.5 ? '👍' : '😊';
        const msg = pct >= 0.8 ? 'すごい！' : pct >= 0.5 ? 'いいね！' : 'またやろう！';

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
            <div style={{ fontSize:80, marginBottom:16, animation:'pop 0.6s ease-out' }}>{emoji}</div>
            <div style={{ fontSize:32, fontWeight:900, color:'#E8652E', marginBottom:12, letterSpacing:'0.08em' }}>{msg}</div>

            <div style={{ background:'white', borderRadius:24, padding:'20px 40px', boxShadow:'0 4px 16px rgba(0,0,0,0.06)', marginBottom:12 }}>
              <div style={{ fontFamily:'Outfit,sans-serif', fontSize:48, fontWeight:900, color:'#E8652E' }}>
                {g.score}<span style={{ fontSize:20, color:'#9E9E9E' }}>てん</span>
              </div>
            </div>

            <div style={{ fontSize:20, fontWeight:700, color:'#6B6B6B', marginBottom:40 }}>
              {g.correct}もん せいかい / {total}もん
            </div>

            <button onClick={startGame} style={{
              ...bs, fontSize:24, fontWeight:900, color:'white',
              background:'#E8652E', border:'none',
              padding:'22px 48px', borderRadius:60,
              letterSpacing:'0.08em',
              boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
            }}>
              もういちど
            </button>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
