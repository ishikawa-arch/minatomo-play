<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>ストループ | みなともPlay</title>
<meta name="description" content="色と意味の矛盾に対応 - 無料リハビリゲーム みなともPlay">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
<meta name="minatomo-id" content="minatomo-stroop">
<meta name="minatomo-domain-primary" content="executive">
<meta name="minatomo-domain-subdomains" content="inhibition,selective_attention">
<meta name="minatomo-target" content="stroke_subacute,stroke_chronic,tbi,mci,mild_dementia,healthy_elderly">
<meta name="minatomo-difficulty-levels" content="1,2,3">
<meta name="minatomo-duration" content="5">
<meta name="minatomo-completion-status" content="auto_filled">
<meta name="minatomo-applied-patterns" content="P4">
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">
// ========== DATA ==========
const ALL_COLORS = [
  { name:'あか', color:'#E53935' },
  { name:'あお', color:'#1E88E5' },
  { name:'きいろ', color:'#FDD835' },
  { name:'みどり', color:'#43A047' },
  { name:'むらさき', color:'#7B1FA2' },
  { name:'オレンジ', color:'#FF6D00' },
  { name:'ピンク', color:'#EC407A' },
  { name:'ちゃいろ', color:'#6D4C41' },
];

// Difficulty-specific color pools
const COLOR_POOLS = {
  easy: ALL_COLORS.slice(0, 4),     // 4 colors: あか あお きいろ みどり
  normal: ALL_COLORS.slice(0, 6),   // 6 colors: + むらさき オレンジ
  hard: ALL_COLORS,                 // 8 colors: + ピンク ちゃいろ
};

// rule: 'color' = answer the ink color, 'word' = read the word
const DIFF = {
  easy:   { label:'かんたん', emoji:'🌱', desc:'4色・一致あり・ゆっくり', rounds:12, congruentRatio:0.5, timeLimit:0, switchRule:false },
  normal: { label:'ふつう', emoji:'🌿', desc:'6色・不一致多め', rounds:15, congruentRatio:0.2, timeLimit:0, switchRule:false },
  hard:   { label:'むずかしい', emoji:'🌳', desc:'8色・ルール切替・4秒制限', rounds:20, congruentRatio:0.1, timeLimit:4, switchRule:true },
};

function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function generateQ(diff) {
  const cfg = DIFF[diff];
  const colors = COLOR_POOLS[diff];
  const congruent = Math.random() < cfg.congruentRatio;

  // Rule switching: in hard mode, ~40% of questions ask "read the word"
  const rule = cfg.switchRule && Math.random() < 0.4 ? 'word' : 'color';

  // Pick the display color
  const colorIdx = Math.floor(Math.random() * colors.length);
  const displayColor = colors[colorIdx];

  let word;
  if (congruent) {
    word = displayColor.name;
  } else {
    const others = colors.filter(c => c.name !== displayColor.name);
    word = others[Math.floor(Math.random() * others.length)].name;
  }

  // The correct answer depends on the rule
  const correctName = rule === 'color' ? displayColor.name : word;
  const correctColorObj = colors.find(c => c.name === correctName);

  // Generate 4 options (always include correct answer)
  const wrongAnswers = shuffle(colors.filter(c => c.name !== correctName)).slice(0, 3);
  const opts = shuffle([correctColorObj, ...wrongAnswers]);

  return { word, displayColor: displayColor.color, correctName, congruent: congruent && rule === 'color', opts, rule };
}

// ========== MAIN ==========
function App() {
  const [screen, setScreen] = React.useState('select');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [history, setHistory] = React.useState([]);
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    phase: 'idle',
    questions: [],
    currentQ: 0,
    score: 0,
    correct: 0,
    selected: null,
    feedback: null,
    results: [],
    timeLeft: 0,
  }).current;

  const timerRef = React.useRef(null);
  React.useEffect(() => () => { clearTimeout(timerRef.current); clearInterval(timerRef.current); }, []);

  const startGame = (diff) => {
    setDifficulty(diff);
    const cfg = DIFF[diff];
    const questions = [];
    for (let i = 0; i < cfg.rounds; i++) questions.push(generateQ(diff));
    g.questions = questions;
    g.currentQ = 0;
    g.score = 0;
    g.correct = 0;
    g.selected = null;
    g.feedback = null;
    g.results = [];
    g.phase = 'playing';
    setShowConfetti(false);
    setScreen('game');
    if (cfg.timeLimit > 0) startTimer(cfg.timeLimit);
    rerender();
  };

  const startTimer = (seconds) => {
    g.timeLeft = seconds;
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      g.timeLeft--;
      rerender();
      if (g.timeLeft <= 0) {
        clearInterval(timerRef.current);
        // Time's up - count as wrong
        handleTimeout();
      }
    }, 1000);
  };

  const handleTimeout = () => {
    if (g.selected !== null) return;
    const q = g.questions[g.currentQ];
    g.selected = '__timeout__';
    g.feedback = 'timeout';
    g.results.push({ q, selected: null, correct: false, timeout: true });
    rerender();
    timerRef.current = setTimeout(() => nextQ(), 1500);
  };

  const handleAnswer = (opt) => {
    if (g.selected !== null) return;
    clearInterval(timerRef.current);
    const q = g.questions[g.currentQ];
    g.selected = opt.name;
    const isCorrect = opt.name === q.correctName;

    if (isCorrect) {
      g.score += q.congruent ? 8 : 12; // More points for incongruent
      g.correct++;
      g.feedback = 'correct';
    } else {
      g.feedback = 'wrong';
    }
    g.results.push({ q, selected: opt.name, correct: isCorrect, timeout: false });
    rerender();

    timerRef.current = setTimeout(() => nextQ(), 1200);
  };

  const nextQ = () => {
    if (g.currentQ + 1 >= g.questions.length) { finishGame(); return; }
    g.currentQ++;
    g.selected = null;
    g.feedback = null;
    const cfg = DIFF[difficulty];
    if (cfg.timeLimit > 0) startTimer(cfg.timeLimit);
    rerender();
  };

  const finishGame = () => {
    clearInterval(timerRef.current);
    g.phase = 'result'; rerender();
    const pct = g.correct / g.questions.length;
    if (pct >= 0.8) { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 4000); }
    setHistory(prev => [{ diff: difficulty, correct: g.correct, total: g.questions.length, score: g.score, date: new Date().toISOString() }, ...prev].slice(0, 20));
    setScreen('result');
  };

  const goBack = () => { clearInterval(timerRef.current); clearTimeout(timerRef.current); g.phase = 'idle'; setScreen('select'); rerender(); };

  const cfg = DIFF[difficulty] || DIFF.normal;
  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };

  const ConfettiEl = showConfetti ? (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:999, overflow:'hidden' }}>
      <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`}</style>
      {Array.from({length:50},(_,i) => (
        <div key={i} style={{ position:'absolute', top:-10, left:Math.random()*100+'%', width:6+Math.random()*8, height:6+Math.random()*8, background:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], borderRadius:Math.random()>0.5?'50%':2, animation:`cf ${2+Math.random()*2}s linear ${Math.random()*1.5}s forwards` }} />
      ))}
    </div>
  ) : null;

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF7', minHeight:'100vh', color:'#2D2D2D' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px', borderRadius:8}}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#FF6B35' }}>🔄 ストループチャレンジ</span>
        </div>
        {screen === 'game' && (
          <div style={{ display:'flex', gap:6 }}>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#2EC4B6', padding:'3px 10px', borderRadius:50 }}>{g.currentQ+1}/{g.questions.length}</span>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#FF6B35', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
          </div>
        )}
      </div>

      {/* ===== SELECT ===== */}
      {screen === 'select' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16, animation:'bounce 2s infinite' }}>🔄</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:6 }}>ストループチャレンジ</div>
          <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:8, lineHeight:1.7 }}>文字の「色」を答えよう！<br/>文字の「意味」にまどわされないで！</div>
          <div style={{ fontSize:12, color:'#9E9E9E', marginBottom:20, background:'#FFF3E0', padding:'8px 16px', borderRadius:12 }}>🧠 抑制制御（前頭葉機能）のトレーニングです</div>

          {/* Example */}
          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'18px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)' }}>
            <div style={{ fontSize:14, fontWeight:700, marginBottom:16, textAlign:'left' }}>🎯 こういう問題です</div>

            {/* Example 1: color mode */}
            <div style={{ padding:'12px 14px', background:'#F3E5F5', borderRadius:12, marginBottom:10 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#7B1FA2', marginBottom:8 }}>🎨 文字の「色」は？</div>
              <div style={{ display:'flex', alignItems:'center', gap:16, justifyContent:'center' }}>
                <div style={{ fontSize:38, fontWeight:900, color:'#1E88E5' }}>あか</div>
                <div style={{ fontSize:20 }}>→</div>
                <div style={{ fontSize:18, fontWeight:900, color:'#1E88E5', background:'#E3F2FD', padding:'6px 14px', borderRadius:10 }}>あお ✅</div>
              </div>
              <div style={{ fontSize:11, color:'#6B6B6B', marginTop:6 }}>「あか」と書いてあるけど色は<strong style={{color:'#1E88E5'}}>青</strong>→「あお」</div>
            </div>

            {/* Example 2: word mode (hard) */}
            <div style={{ padding:'12px 14px', background:'#FFEBEE', borderRadius:12, border:'2px solid #EF9A9A' }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#E53935', marginBottom:8 }}>📖 文字を「読んで」！（むずかしいモード）</div>
              <div style={{ display:'flex', alignItems:'center', gap:16, justifyContent:'center' }}>
                <div style={{ fontSize:38, fontWeight:900, color:'#43A047' }}>あか</div>
                <div style={{ fontSize:20 }}>→</div>
                <div style={{ fontSize:18, fontWeight:900, color:'#E53935', background:'#FFCDD2', padding:'6px 14px', borderRadius:10 }}>あか ✅</div>
              </div>
              <div style={{ fontSize:11, color:'#6B6B6B', marginTop:6 }}>色は緑だけど<strong>書いてある文字</strong>を読む→「あか」</div>
            </div>

            <div style={{ fontSize:11, color:'#9E9E9E', marginTop:10, textAlign:'left', lineHeight:1.7 }}>
              💡 むずかしいモードではルールが毎回切り替わります！指示をよく見てね
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420 }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度を選んでスタート</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {Object.entries(DIFF).map(([k,d]) => (
                <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'3px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left'}}>
                  <span style={{ fontSize:26 }}>{d.emoji}</span>
                  <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
                </button>
              ))}
            </div>
          </div>

          {history.length > 0 && (
            <div style={{ width:'100%', maxWidth:420, marginTop:28, textAlign:'left' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
              {history.slice(0,5).map((h,i) => {
                const hc = DIFF[h.diff]; const d = new Date(h.date);
                return (
                  <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                      <div><div style={{fontSize:12,fontWeight:700}}>{hc.label}・{h.correct}/{h.total}正解</div><div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div></div>
                    </div>
                    <div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#FF6B35'}}>{h.score}pt</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ===== GAME ===== */}
      {screen === 'game' && g.phase === 'playing' && (() => {
        const q = g.questions[g.currentQ];
        if (!q) return null;

        return (
          <div style={{ padding:'0 16px', maxWidth:500, margin:'0 auto' }}>
            {/* Status */}
            <div style={{ display:'flex', justifyContent:'center', gap:16, padding:'12px 16px', background:'white', borderBottom:'1px solid #F0F0F0', borderRadius:'0 0 16px 16px', marginBottom:8 }}>
              {[
                {v:g.score,l:'スコア',c:'#FF6B35'},
                {v:g.correct+'/'+(g.currentQ+(g.selected!==null?1:0)),l:'正解',c:'#2EC4B6'},
                {v:(g.currentQ+1)+'/'+g.questions.length,l:'問題',c:'#7B1FA2'},
                ...(cfg.timeLimit > 0 ? [{v:g.timeLeft+'秒',l:'残り',c:g.timeLeft<=2?'#E53935':'#6B6B6B'}] : []),
              ].map((s,i) => (
                <div key={i} style={{ textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:s.c, animation:s.l==='残り'&&g.timeLeft<=2?'pulse 0.5s infinite':undefined }}>{s.v}</div>
                  <div style={{ fontSize:9, color:'#9E9E9E', marginTop:2 }}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Progress */}
            <div style={{ display:'flex', gap:3, marginBottom:12 }}>
              {g.questions.map((_,i) => (
                <div key={i} style={{ flex:1, height:5, borderRadius:3, background: i < g.results.length ? (g.results[i].correct ? '#66BB6A' : '#EF5350') : i === g.currentQ ? '#FFB74D' : '#E8E8E8' }} />
              ))}
            </div>

            <div style={{ animation:'fadeUp 0.25s ease-out' }} key={g.currentQ}>
              {/* Instruction - prominent for rule switching */}
              <div style={{ textAlign:'center', marginBottom:10 }}>
                {q.rule === 'color' ? (
                  <span style={{ fontSize:15, fontWeight:900, color:'#7B1FA2', background:'#F3E5F5', padding:'8px 20px', borderRadius:50 }}>
                    🎨 文字の「色」は？
                  </span>
                ) : (
                  <span style={{ fontSize:15, fontWeight:900, color:'#E53935', background:'#FFEBEE', padding:'8px 20px', borderRadius:50, border:'2px solid #EF9A9A' }}>
                    📖 文字を「読んで」！
                  </span>
                )}
              </div>

              {/* Stroop word display */}
              <div style={{
                background:'white', borderRadius:24, padding:'36px 20px',
                boxShadow:'0 4px 24px rgba(0,0,0,0.06)', marginBottom:18, textAlign:'center',
                border: q.rule === 'word' ? '3px solid #EF9A9A' : '3px solid transparent',
              }}>
                <div style={{
                  fontSize:56, fontWeight:900, color: q.displayColor,
                  textShadow: q.displayColor === '#FDD835' ? '0 0 2px rgba(0,0,0,0.2)' : 'none',
                  letterSpacing:8, lineHeight:1.2,
                }}>
                  {q.word}
                </div>
              </div>

              {/* Timer bar for hard mode */}
              {cfg.timeLimit > 0 && g.selected === null && (
                <div style={{ width:'100%', height:6, background:'#E8E8E8', borderRadius:3, marginBottom:14, overflow:'hidden' }}>
                  <div style={{ width:(g.timeLeft/cfg.timeLimit*100)+'%', height:'100%', background:g.timeLeft<=2?'#E53935':'linear-gradient(90deg,#FF6B35,#FF8F5E)', borderRadius:3, transition:'width 1s linear' }} />
                </div>
              )}

              {/* Color options - 2x2 or 2x3 */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10 }}>
                {q.opts.map((opt, i) => {
                  const isSelected = g.selected === opt.name;
                  const isCorrect = opt.name === q.correctName;
                  const answered = g.selected !== null;

                  return (
                    <button key={i} onClick={() => handleAnswer(opt)} disabled={answered}
                      style={{
                        ...btnBase, padding:'18px 14px', borderRadius:16, textAlign:'center',
                        border: `3px solid ${answered&&isCorrect?'#66BB6A':answered&&isSelected&&!isCorrect?'#EF5350':'#E8E8E8'}`,
                        background: answered&&isCorrect?'#E8F5E9':answered&&isSelected&&!isCorrect?'#FFEBEE':'white',
                        opacity: answered&&!isCorrect&&!isSelected?0.3:1,
                        display:'flex', alignItems:'center', justifyContent:'center', gap:10,
                      }}>
                      {/* Color swatch */}
                      <div style={{ width:24, height:24, borderRadius:'50%', background:opt.color, border:'2px solid rgba(0,0,0,0.1)', flexShrink:0 }} />
                      <span style={{ fontSize:16, fontWeight:700, color:answered&&isCorrect?'#2E7D32':answered&&isSelected&&!isCorrect?'#C62828':'#2D2D2D' }}>
                        {opt.name}
                      </span>
                      {answered && isCorrect && <span style={{ fontSize:14 }}>✅</span>}
                    </button>
                  );
                })}
              </div>

              {/* Feedback */}
              {g.feedback && (
                <div style={{ textAlign:'center', marginTop:14, animation:'fadeUp 0.2s ease-out' }}>
                  {g.feedback === 'correct' && (
                    <div style={{ fontSize:16, fontWeight:900, color:'#2E7D32' }}>✅ 正解！</div>
                  )}
                  {g.feedback === 'wrong' && (
                    <div>
                      <div style={{ fontSize:16, fontWeight:900, color:'#C62828' }}>
                        ❌ {q.rule === 'color' ? '色' : '文字'}は「{q.correctName}」
                      </div>
                    </div>
                  )}
                  {g.feedback === 'timeout' && (
                    <div>
                      <div style={{ fontSize:16, fontWeight:900, color:'#E65100' }}>⏰ 時間切れ！</div>
                      <div style={{ fontSize:13, color:'#6B6B6B', marginTop:4 }}>
                        {q.rule === 'color' ? '色' : '文字'}は「{q.correctName}」
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div style={{ height:24 }} />
          </div>
        );
      })()}

      {/* ===== RESULT ===== */}
      {screen === 'result' && (() => {
        const total = g.questions.length;
        const pct = total > 0 ? g.correct / total : 0;
        const stars = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.55 ? '⭐⭐' : '⭐';
        const msg = pct >= 0.85 ? 'すばらしい集中力！' : pct >= 0.55 ? 'よくできました！' : 'もう一度挑戦！';

        // Congruent vs incongruent stats
        const congruent = g.results.filter(r => r.q.congruent);
        const incongruent = g.results.filter(r => !r.q.congruent && r.q.rule === 'color');
        const conCorr = congruent.filter(r => r.correct).length;
        const incCorr = incongruent.filter(r => r.correct).length;
        const wordRule = g.results.filter(r => r.q.rule === 'word');
        const wordCorr = wordRule.filter(r => r.correct).length;
        const timeouts = g.results.filter(r => r.timeout).length;

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'30px 20px', textAlign:'center' }}>
            <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:4, animation:'fadeUp 0.6s ease-out 0.1s both' }}>{msg}</div>
            <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:24, animation:'fadeUp 0.6s ease-out 0.2s both' }}>{cfg.label}モード</div>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:24, animation:'fadeUp 0.6s ease-out 0.3s both' }}>
              {[{v:`${g.correct}/${total}`,l:'正解数'},{v:Math.round(pct*100)+'%',l:'正答率'},{v:g.score,l:'スコア'}].map((s,i) =>
                <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:24, fontWeight:800, color:'#FF6B35' }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
                </div>
              )}
            </div>

            {/* Congruent vs incongruent breakdown */}
            <div style={{ display:'flex', flexWrap:'wrap', gap:8, width:'100%', maxWidth:360, marginBottom:24, justifyContent:'center', animation:'fadeUp 0.6s ease-out 0.35s both' }}>
              {congruent.length > 0 && (
                <div style={{ minWidth:80, flex:'1 1 80px', background:'white', borderRadius:14, padding:'12px 8px', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', textAlign:'center' }}>
                  <div style={{ fontSize:18, marginBottom:2 }}>✅</div>
                  <div style={{ fontSize:10, fontWeight:700, color:'#43A047' }}>一致問題</div>
                  <div style={{ fontSize:9, color:'#9E9E9E' }}>色と文字が同じ</div>
                  <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, marginTop:4 }}>{conCorr}/{congruent.length}</div>
                </div>
              )}
              <div style={{ minWidth:80, flex:'1 1 80px', background:'white', borderRadius:14, padding:'12px 8px', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', textAlign:'center' }}>
                <div style={{ fontSize:18, marginBottom:2 }}>🔄</div>
                <div style={{ fontSize:10, fontWeight:700, color:'#E53935' }}>不一致問題</div>
                <div style={{ fontSize:9, color:'#9E9E9E' }}>色と文字がちがう</div>
                <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, marginTop:4 }}>{incCorr}/{incongruent.length}</div>
              </div>
              {timeouts > 0 && (
                <div style={{ minWidth:80, flex:'1 1 80px', background:'white', borderRadius:14, padding:'12px 8px', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', textAlign:'center' }}>
                  <div style={{ fontSize:18, marginBottom:2 }}>⏰</div>
                  <div style={{ fontSize:10, fontWeight:700, color:'#E65100' }}>時間切れ</div>
                  <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, marginTop:4 }}>{timeouts}回</div>
                </div>
              )}
              {wordRule.length > 0 && (
                <div style={{ minWidth:80, flex:'1 1 80px', background:'white', borderRadius:14, padding:'12px 8px', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', textAlign:'center' }}>
                  <div style={{ fontSize:18, marginBottom:2 }}>📖</div>
                  <div style={{ fontSize:10, fontWeight:700, color:'#E53935' }}>文字を読む</div>
                  <div style={{ fontSize:9, color:'#9E9E9E' }}>ルール切替</div>
                  <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, marginTop:4 }}>{wordCorr}/{wordRule.length}</div>
                </div>
              )}
            </div>

            {/* Review */}
            <div style={{ width:'100%', maxWidth:420, marginBottom:28, animation:'fadeUp 0.6s ease-out 0.4s both' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📋 回答の振り返り</div>
              {g.results.map((r, i) => (
                <div key={i} style={{ background:r.correct?'#F1F8E9':r.timeout?'#FFF8E1':'#FFEBEE', borderRadius:12, padding:'10px 14px', marginBottom:4, borderLeft:`4px solid ${r.correct?'#66BB6A':r.timeout?'#FFB300':'#EF5350'}`, display:'flex', alignItems:'center', gap:10 }}>
                  <div style={{ fontSize:22, fontWeight:900, color:r.q.displayColor, flexShrink:0, width:50, textAlign:'center',
                    textShadow: r.q.displayColor === '#FDD835' ? '0 0 1px rgba(0,0,0,0.2)' : 'none' }}>
                    {r.q.word}
                  </div>
                  <div style={{ flex:1, textAlign:'left' }}>
                    <div style={{ fontSize:12, fontWeight:700 }}>
                      {r.correct ? '✅' : r.timeout ? '⏰' : '❌'} {r.q.rule==='color'?'色':'文字'}: {r.q.correctName}
                      {r.q.rule === 'word' && <span style={{ fontSize:10, color:'#E53935', marginLeft:4 }}>📖</span>}
                      {!r.q.congruent && r.q.rule==='color' && <span style={{ fontSize:10, color:'#AB47BC', marginLeft:4 }}>🔄</span>}
                    </div>
                    {!r.correct && !r.timeout && <div style={{ fontSize:11, color:'#C62828' }}>選んだ: {r.selected}</div>}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ width:'100%', maxWidth:420, marginBottom:24, padding:'14px 16px', background:'#F5F5F5', borderRadius:12, textAlign:'left', animation:'fadeUp 0.6s ease-out 0.45s both' }}>
              <div style={{ fontSize:12, fontWeight:700, color:'#6B6B6B', marginBottom:6 }}>💡 ストループ効果とは？</div>
              <div style={{ fontSize:11, color:'#9E9E9E', lineHeight:1.8 }}>
                文字の意味を無視して色だけに注目するのは、脳の「抑制制御」を使います。この力は衝動を抑えたり、注意を切り替えたりする日常の場面で大切です。
              </div>
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300, animation:'fadeUp 0.6s ease-out 0.5s both' }}>
              <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60}}>もう一度プレイ 🔄</button>
              <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60}}>設定を変える</button>
            </div>
          </div>
        );
      })()}

      {ConfettiEl}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
