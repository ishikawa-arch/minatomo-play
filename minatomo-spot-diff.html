function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

const DIFF = {
  easy:   { label:'かんたん', emoji:'🌱', desc:'ちがい2つ・消える変化が中心', differences:2, rounds:6 },
  normal: { label:'ふつう', emoji:'🌿', desc:'ちがい3つ・色やサイズも変わる', differences:3, rounds:6 },
  hard:   { label:'むずかしい', emoji:'🌳', desc:'ちがい4つ・位置ずれ・微妙な変化', differences:4, rounds:6, timeLimit:25 },
};

function generatePuzzle(diffCount, diff) {
  const scene = SCENES[Math.floor(Math.random() * SCENES.length)];
  const original = scene.elements.map(el => ({ ...el }));

  // Pick elements to modify using difficulty-appropriate mods
  const tier = diff || 'normal';
  const modifiable = original.map((el, i) => ({ el, i })).filter(({el}) => MODS[el.type] && MODS[el.type][tier] && MODS[el.type][tier].length > 0);
  const toModify = shuffle(modifiable).slice(0, diffCount);

  const modified = original.map(el => ({ ...el }));
  const changes = [];

  toModify.forEach(({ el, i }) => {
    const possibleMods = MODS[el.type][tier];
    const mod = possibleMods[Math.floor(Math.random() * possibleMods.length)];
    const result = mod(el);
    if (result === null) {
      // Mark as hidden but keep area for tap detection
      modified[i] = { type:'_hidden', area: el.area };
      changes.push({ idx: i, type: 'removed', area: el.area, desc: `${el.type}が消えた` });
    } else {
      modified[i] = result;
      changes.push({ idx: i, type: 'changed', area: el.area, desc: `${el.type}が変わった` });
    }
  });

  return { sky: scene.sky, ground: scene.ground, groundY: scene.groundY, original, modified, changes, diffIndices: changes.map(c => c.idx) };
}

        <rect width={W} height={H} fill={sky} />
        {/* Ground */}
        <ellipse cx={W/2} cy={H+10} rx={W*0.8} ry={H-groundY+15} fill={ground} />
        {/* Elements */}
        {elements.map((el, i) => {
          if (!el || el.type === '_hidden') return null;
          const Comp = ELEMENTS[el.type];
          if (!Comp) {
            if (el.type === 'bench') {
              return (
                <g key={i}>
                  <rect x={el.x||120} y={(el.y||140)-5} width={40} height={4} fill="#8D6E63" rx="2" />
                  <rect x={el.x||120} y={(el.y||140)} width={3} height={12} fill="#5D4037" />
                  <rect x={(el.x||120)+37} y={(el.y||140)} width={3} height={12} fill="#5D4037" />
                  <rect x={(el.x||120)-2} y={(el.y||140)-12} width={44} height={3} fill="#8D6E63" rx="1" />
                </g>
              );
            }
            return null;
          }
          return <g key={i}>{Comp(el)}</g>;
        })}
      </svg>

      {/* Clickable overlay areas for interactive mode */}
      {interactive && elements.map((el, i) => {
        if (!el || !el.area) return null;
        const hl = highlights && highlights.has(i);
        const scaleX = 100 / 370;
        const scaleY = 100 / 180;
        return (
          <div key={i}
            onClick={() => onClick && onClick(i)}
            style={{
              position:'absolute',
              left: el.area.x * scaleX + '%',
              top: el.area.y * scaleY + '%',
              width: el.area.w * scaleX + '%',
              height: el.area.h * scaleY + '%',
              cursor:'pointer',
              borderRadius:8,
              border: hl ? '3px solid #66BB6A' : 'none',
              background: hl ? 'rgba(102,187,106,0.2)' : 'transparent',
            }}
          />
        );
      })}

      {/* Answer areas - show found (green) and unfound (orange dashed) on bottom image */}
      {answerAreas && answerAreas.map((aa, i) => {
        const scaleX = 100 / 370;
        const scaleY = 100 / 180;
        return (
          <div key={'aa'+i} style={{
            position:'absolute',
            left: aa.area.x * scaleX + '%',
            top: aa.area.y * scaleY + '%',
            width: aa.area.w * scaleX + '%',
            height: aa.area.h * scaleY + '%',
            borderRadius:8,
            border: aa.found ? '3px solid #66BB6A' : '3px dashed #FF6B35',
            background: aa.found ? 'rgba(102,187,106,0.2)' : 'rgba(255,107,53,0.15)',
          }} />
        );
      })}
    </div>
  );
}

// ========== MAIN ==========
function App() {
  const [screen, setScreen] = React.useState('select');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [history, setHistory] = React.useState([]);
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    phase: 'idle',
    puzzles: [],
    currentP: 0,
    score: 0,
    correct: 0,
    foundIndices: new Set(),
    wrongTaps: 0,
    feedback: null,
    results: [],
    timeLeft: 0,
  }).current;

  const timerRef = React.useRef(null);

  const startGame = (diff) => {
    setDifficulty(diff);
    const cfg = DIFF[diff];
    const puzzles = [];
    for (let i = 0; i < cfg.rounds; i++) puzzles.push(generatePuzzle(cfg.differences, diff));
    g.puzzles = puzzles;
    g.currentP = 0;
    g.score = 0;
    g.correct = 0;
    g.results = [];
    setShowConfetti(false);
    setScreen('game');
    setupPuzzle(0, diff);
  };

  const setupPuzzle = (idx, diff) => {
    const cfg = DIFF[diff || difficulty];
    g.currentP = idx;
    g.foundIndices = new Set();
    g.wrongTaps = 0;
    g.feedback = null;
    g.timeLeft = cfg.timeLimit || 0;
    g.phase = 'playing';
    rerender();

    if (cfg.timeLimit > 0) {
      clearInterval(timerRef.current);
      timerRef.current = setInterval(() => {
        g.timeLeft--;
        rerender();
        if (g.timeLeft <= 0) { clearInterval(timerRef.current); endPuzzle(false); }
      }, 1000);
    }
  };

  const handleTap = (idx) => {
    if (g.phase !== 'playing') return;
    if (g.foundIndices.has(idx)) return;
    const puzzle = g.puzzles[g.currentP];

    if (puzzle.diffIndices.includes(idx)) {
      g.foundIndices.add(idx);
      g.score += 10;
      rerender();
      if (g.foundIndices.size >= puzzle.changes.length) {
        setTimeout(() => endPuzzle(true), 400);
      }
    } else {
      g.wrongTaps++;
      g.score = Math.max(0, g.score - 3);
      rerender();
    }
  };

  const endPuzzle = (allFound) => {
    clearInterval(timerRef.current);
    if (allFound) { g.correct++; g.score += 5; }
    g.results.push({ found: g.foundIndices.size, total: g.puzzles[g.currentP].changes.length, wrongTaps: g.wrongTaps, allFound });
    g.phase = 'puzzle-end';
    rerender();
  };

  const nextPuzzle = () => {
    if (g.currentP + 1 >= g.puzzles.length) finishGame();
    else setupPuzzle(g.currentP + 1, difficulty);
  };

  const finishGame = () => {
    clearInterval(timerRef.current);
    g.phase = 'result'; rerender();
    const pct = g.correct / g.puzzles.length;
    if (pct >= 0.7) { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 4000); }
    setHistory(prev => [{ diff: difficulty, correct: g.correct, total: g.puzzles.length, score: g.score, date: new Date().toISOString() }, ...prev].slice(0, 20));
    setScreen('result');
  };

  const goBack = () => { clearInterval(timerRef.current); g.phase = 'idle'; setScreen('select'); rerender(); };

  const cfg = DIFF[difficulty] || DIFF.normal;
  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };

  const ConfettiEl = showConfetti ? (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:999, overflow:'hidden' }}>
      <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`}</style>
      {Array.from({length:50},(_,i) => (
        <div key={i} style={{ position:'absolute', top:-10, left:Math.random()*100+'%', width:6+Math.random()*8, height:6+Math.random()*8, background:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], borderRadius:Math.random()>0.5?'50%':2, animation:`cf ${2+Math.random()*2}s linear ${Math.random()*1.5}s forwards` }} />
      ))}
    </div>
  ) : null;

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF7', minHeight:'100vh', color:'#2D2D2D' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px', borderRadius:8}}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#FF6B35' }}>🎯 まちがい探し</span>
        </div>
        {screen === 'game' && (
          <div style={{ display:'flex', gap:6 }}>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#2EC4B6', padding:'3px 10px', borderRadius:50 }}>{g.currentP+1}/{g.puzzles.length}</span>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#FF6B35', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
          </div>
        )}
      </div>

      {/* ===== SELECT ===== */}
      {screen === 'select' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16, animation:'bounce 2s infinite' }}>🎯</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:6 }}>まちがい探し</div>
          <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:8, lineHeight:1.7 }}>2つの絵をくらべて<br/>ちがいを見つけよう！</div>

          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'18px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'left' }}>
            <div style={{ fontSize:14, fontWeight:700, marginBottom:12 }}>🎯 遊び方</div>
            <div style={{ fontSize:13, color:'#6B6B6B', lineHeight:2 }}>
              ① 上が「みほん」の絵です<br/>
              ② 下の絵に何か所かちがいがあります<br/>
              ③ ちがう部分をタップして見つけよう！<br/>
              ④ 色・大きさ・あるなしが変わっています
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420 }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度を選んでスタート</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {Object.entries(DIFF).map(([k,d]) => (
                <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'3px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left'}}>
                  <span style={{ fontSize:26 }}>{d.emoji}</span>
                  <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
                </button>
              ))}
            </div>
          </div>

          {history.length > 0 && (
            <div style={{ width:'100%', maxWidth:420, marginTop:28, textAlign:'left' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
              {history.slice(0,5).map((h,i) => {
                const hc = DIFF[h.diff]; const d = new Date(h.date);
                return (
                  <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                      <div><div style={{fontSize:12,fontWeight:700}}>{hc.label}・{h.correct}/{h.total}クリア</div><div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div></div>
                    </div>
                    <div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#FF6B35'}}>{h.score}pt</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ===== GAME ===== */}
      {screen === 'game' && (g.phase === 'playing' || g.phase === 'puzzle-end') && (() => {
        const puzzle = g.puzzles[g.currentP];
        if (!puzzle) return null;


        return (
          <div style={{ padding:'0 12px', maxWidth:500, margin:'0 auto' }}>
            {/* Status */}
            <div style={{ display:'flex', justifyContent:'center', gap:14, padding:'8px 12px', background:'white', borderBottom:'1px solid #F0F0F0', borderRadius:'0 0 12px 12px', marginBottom:6 }}>
              {[
                {v:g.score,l:'スコア',c:'#FF6B35'},
                {v:`${g.foundIndices.size}/${puzzle.changes.length}`,l:'発見',c:'#2EC4B6'},
                {v:(g.currentP+1)+'/'+g.puzzles.length,l:'問題',c:'#7B1FA2'},
                ...(cfg.timeLimit && g.phase==='playing' ? [{v:g.timeLeft+'秒',l:'残り',c:g.timeLeft<=5?'#E53935':'#6B6B6B'}] : []),
              ].map((s,i) => (
                <div key={i} style={{ textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:15, fontWeight:800, color:s.c, animation:s.l==='残り'&&g.timeLeft<=5?'pulse 0.5s infinite':undefined }}>{s.v}</div>
                  <div style={{ fontSize:8, color:'#9E9E9E' }}>{s.l}</div>
                </div>
              ))}
            </div>

            <div style={{ animation:'fadeUp 0.3s ease-out' }} key={g.currentP}>
              {/* Original - always clean, no markers */}
              <div style={{ fontSize:11, fontWeight:700, color:'#7B1FA2', textAlign:'center', marginBottom:4 }}>
                👆 みほん
              </div>
              <SceneView
                sky={puzzle.sky} ground={puzzle.ground} groundY={puzzle.groundY}
                elements={puzzle.original}
              />

              <div style={{ display:'flex', alignItems:'center', gap:8, margin:'6px 0' }}>
                <div style={{ flex:1, height:2, background:'#E0E0E0' }} />
                <span style={{ fontSize:11, fontWeight:700, color:'#FF6B35' }}>
                  {g.phase === 'puzzle-end' ? '↕️ くらべてみよう' : '↕️ ちがいを探そう'}
                </span>
                <div style={{ flex:1, height:2, background:'#E0E0E0' }} />
              </div>

              {/* Modified - interactive during play, answer markers during puzzle-end */}
              <div style={{ fontSize:11, fontWeight:700, color:'#FF6B35', textAlign:'center', marginBottom:4 }}>
                {g.phase === 'puzzle-end'
                  ? `👇 こちらの絵（⭕ = 見つけられなかったちがい）`
                  : '👇 ちがうところをタップ！'}
              </div>
              <SceneView
                sky={puzzle.sky} ground={puzzle.ground} groundY={puzzle.groundY}
                elements={puzzle.modified}
                highlights={g.phase === 'playing' ? g.foundIndices : null}
                onClick={g.phase === 'playing' ? handleTap : null}
                interactive={g.phase === 'playing'}
                answerAreas={g.phase === 'puzzle-end' ? puzzle.changes.map(c => ({
                  area: c.area,
                  found: g.foundIndices.has(c.idx),
                })) : null}
              />

              {g.phase === 'playing' && (
                <button onClick={() => endPuzzle(false)} style={{...btnBase, marginTop:10, width:'100%', fontSize:12, fontWeight:700, padding:'8px', borderRadius:50, border:'2px solid #E0E0E0', background:'white', color:'#9E9E9E' }}>
                  わからない…答えを見る
                </button>
              )}

              {g.phase === 'puzzle-end' && (
                <div style={{ textAlign:'center', marginTop:12, animation:'fadeUp 0.3s ease-out' }}>
                  <div style={{ fontSize:30, marginBottom:4 }}>{g.foundIndices.size >= puzzle.changes.length ? '🎉' : '🤔'}</div>
                  <div style={{ fontSize:16, fontWeight:900, color:g.foundIndices.size >= puzzle.changes.length?'#2E7D32':'#E65100' }}>
                    {g.foundIndices.size >= puzzle.changes.length ? '全部見つけた！' : `${g.foundIndices.size}/${puzzle.changes.length} 見つけた`}
                  </div>
                  <button onClick={nextPuzzle} style={{...btnBase, marginTop:10, fontSize:14, fontWeight:700, padding:'12px 28px', borderRadius:50, background:g.foundIndices.size >= puzzle.changes.length?'#66BB6A':'#FF6B35', border:'none', color:'white'}}>
                    {g.currentP+1 >= g.puzzles.length ? '結果を見る →' : '次へ →'}
                  </button>
                </div>
              )}
            </div>
            <div style={{ height:20 }} />
          </div>
        );
      })()}

      {/* ===== RESULT ===== */}
      {screen === 'result' && (() => {
        const total = g.puzzles.length;
        const pct = total > 0 ? g.correct / total : 0;
        const stars = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.5 ? '⭐⭐' : '⭐';
        const msg = pct >= 0.85 ? 'すばらしい観察力！' : pct >= 0.5 ? 'よくできました！' : 'もう一度挑戦！';

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'30px 20px', textAlign:'center' }}>
            <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:4 }}>{msg}</div>
            <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:24 }}>{cfg.label}モード</div>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:24 }}>
              {[{v:`${g.correct}/${total}`,l:'完全クリア'},{v:Math.round(pct*100)+'%',l:'正答率'},{v:g.score,l:'スコア'}].map((s,i) =>
                <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:24, fontWeight:800, color:'#FF6B35' }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
                </div>
              )}
            </div>

            <div style={{ width:'100%', maxWidth:420, marginBottom:28 }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📋 結果</div>
              {g.results.map((r, i) => (
                <div key={i} style={{ background:r.allFound?'#F1F8E9':'#FFF3E0', borderRadius:12, padding:'10px 14px', marginBottom:6, borderLeft:`4px solid ${r.allFound?'#66BB6A':'#FF6B35'}`, textAlign:'left', fontSize:16, fontWeight:700 }}>
                  {r.allFound ? '✅' : '❌'} 問題{i+1} — {r.found}/{r.total}発見 {r.wrongTaps>0?`（ミス${r.wrongTaps}回）`:''}
                </div>
              ))}
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300 }}>
              <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60}}>もう一度プレイ 🔄</button>
              <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60}}>設定を変える</button>
            </div>
          </div>
        );
      })()}

      {ConfettiEl}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
