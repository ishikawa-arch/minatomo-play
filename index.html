const DOMAIN_INFO = {"memory": {"name": "記憶", "icon": "🧠", "color": "#FF6B35", "bg": "#FFF3E0", "desc": "覚えて思い出す力"}, "attention": {"name": "注意力", "icon": "👁️", "color": "#1E88E5", "bg": "#E3F2FD", "desc": "見つける・集中する力"}, "executive": {"name": "遂行", "icon": "🔄", "color": "#7B1FA2", "bg": "#F3E5F5", "desc": "判断・切り替え・計画"}, "orientation": {"name": "見当識", "icon": "📅", "color": "#43A047", "bg": "#E8F5E9", "desc": "日時・場所の把握"}, "visuospatial": {"name": "視空間", "icon": "🧩", "color": "#00ACC1", "bg": "#E0F7FA", "desc": "空間を理解する力"}, "calculation": {"name": "計算", "icon": "🔢", "color": "#E53935", "bg": "#FFEBEE", "desc": "数を扱う力"}, "uncategorized": {"name": "未分類", "icon": "📦", "color": "#757575", "bg": "#F5F5F5", "desc": "カテゴリ調整中"}};
const DOMAIN_ORDER = ["memory", "attention", "executive", "orientation", "visuospatial", "calculation", "uncategorized"];
const SUBDOMAINS = [{"id": "selective_attention", "jp": "選択的注意", "primary": "attention"}, {"id": "sustained_attention", "jp": "持続的注意", "primary": "attention"}, {"id": "divided_attention", "jp": "分配的注意", "primary": "attention"}, {"id": "spatial_attention", "jp": "空間的注意", "primary": "attention"}, {"id": "inhibition", "jp": "抑制機能", "primary": "executive"}, {"id": "set_shifting", "jp": "認知的柔軟性", "primary": "executive"}, {"id": "planning", "jp": "計画立案", "primary": "executive"}, {"id": "working_memory_verbal", "jp": "言語的WM", "primary": "memory"}, {"id": "working_memory_visual", "jp": "視覚的WM", "primary": "memory"}, {"id": "working_memory_spatial", "jp": "空間的WM", "primary": "memory"}, {"id": "working_memory_update", "jp": "WM更新", "primary": "memory"}, {"id": "episodic_memory", "jp": "エピソード記憶", "primary": "memory"}, {"id": "semantic_memory", "jp": "意味記憶", "primary": "memory"}, {"id": "visual_memory", "jp": "視覚記憶", "primary": "memory"}, {"id": "spatial_memory", "jp": "空間記憶", "primary": "memory"}, {"id": "prospective_memory", "jp": "展望記憶", "primary": "memory"}, {"id": "auditory_memory", "jp": "聴覚記憶", "primary": "memory"}, {"id": "mental_rotation", "jp": "心的回転", "primary": "visuospatial"}, {"id": "visual_perception", "jp": "視覚認識", "primary": "visuospatial"}, {"id": "left_right_discrimination", "jp": "左右弁別", "primary": "visuospatial"}, {"id": "topographical", "jp": "地誌的記憶", "primary": "visuospatial"}, {"id": "time_orientation", "jp": "時間見当識", "primary": "orientation"}, {"id": "social_cognition", "jp": "社会的認知", "primary": "executive"}, {"id": "language_fluency", "jp": "言語流暢性", "primary": "memory"}, {"id": "language_processing", "jp": "言語処理", "primary": "memory"}, {"id": "processing_speed", "jp": "処理速度", "primary": "attention"}, {"id": "reaction_time", "jp": "反応速度", "primary": "attention"}, {"id": "motor_control", "jp": "運動制御", "primary": "executive"}, {"id": "rhythm_timing", "jp": "リズム同期", "primary": "executive"}];
const TARGETS = [{"id": "healthy_elderly", "jp": "健常高齢者", "description": "認知機能の予防・維持目的"}, {"id": "mci", "jp": "軽度認知障害", "description": "MCI、認知機能低下の予防的訓練"}, {"id": "mild_dementia", "jp": "軽度認知症", "description": "アルツハイマー型・脳血管性等の軽度"}, {"id": "moderate_dementia", "jp": "中等度認知症", "description": "シンプル版が中心、超大ボタン・自動進行が必要"}, {"id": "stroke_subacute", "jp": "脳卒中亜急性期", "description": "発症後〜6ヶ月、回復期"}, {"id": "stroke_chronic", "jp": "脳卒中慢性期", "description": "発症後6ヶ月以降、生活期"}, {"id": "tbi", "jp": "外傷性脳損傷", "description": "TBI、高次脳機能障害"}, {"id": "parkinson", "jp": "パーキンソン病", "description": "PD、運動症状＋認知症状"}, {"id": "preventive", "jp": "予防", "description": "認知機能低下の予防的活用"}];

const main = document.getElementById('main');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');
const filtersEl = document.getElementById('filters');
const subFiltersEl = document.getElementById('subFilters');
const targetFiltersEl = document.getElementById('targetFilters');
const advToggle = document.getElementById('advToggle');
const advEl = document.getElementById('adv');

let activeFilter = 'all';
let activeSub = null;
let activeTarget = null;
let searchQuery = '';

advToggle.addEventListener('click', () => {
  advEl.classList.toggle('open');
  advToggle.textContent = advEl.classList.contains('open')
    ? '▲ 詳細フィルタを閉じる'
    : '▼ 詳細フィルタ（部位・対象者）';
});

function buildFilters() {
  const counts = { all: GAMES.length, new: GAMES.filter(g => g.is_new).length };
  for (const dom of DOMAIN_ORDER) {
    counts[dom] = GAMES.filter(g => g.domain === dom).length;
  }
  const items = [
    { key: 'all', label: 'すべて', icon: '🎮' },
    { key: 'new', label: '新版', icon: '✨' },
    ...DOMAIN_ORDER.map(d => ({
      key: d, label: DOMAIN_INFO[d].name, icon: DOMAIN_INFO[d].icon,
    })),
  ];
  filtersEl.innerHTML = items.filter(it => (counts[it.key] || 0) > 0).map(it => `
    <button class="filter-btn ${activeFilter === it.key ? 'active' : ''}" data-key="${it.key}">
      <span>${it.icon}</span><span>${it.label}</span><span class="count">${counts[it.key] || 0}</span>
    </button>`).join('');
  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.key;
      buildFilters();
      render();
    });
  });
}

function buildSubFilters() {
  const counts = {};
  for (const g of GAMES) {
    for (const s of g.subdomains) counts[s] = (counts[s] || 0) + 1;
  }
  const items = SUBDOMAINS.filter(s => counts[s.id])
    .sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0))
    .slice(0, 16);
  subFiltersEl.innerHTML = items.map(s => `
    <button class="adv-chip ${activeSub === s.id ? 'active' : ''}" data-sub="${s.id}">
      ${s.jp} <span style="opacity:0.5; font-size:10px;">${counts[s.id]}</span>
    </button>`).join('') + `
    <button class="adv-chip ${activeSub === null ? 'active' : ''}" data-sub="">クリア</button>`;
  subFiltersEl.querySelectorAll('.adv-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSub = btn.dataset.sub || null;
      buildSubFilters();
      render();
    });
  });
}

function buildTargetFilters() {
  const counts = {};
  for (const g of GAMES) {
    for (const t of g.targets) counts[t] = (counts[t] || 0) + 1;
  }
  const items = TARGETS.filter(t => counts[t.id]);
  targetFiltersEl.innerHTML = items.map(t => `
    <button class="adv-chip ${activeTarget === t.id ? 'active' : ''}" data-target="${t.id}">
      ${t.jp} <span style="opacity:0.5; font-size:10px;">${counts[t.id]}</span>
    </button>`).join('') + `
    <button class="adv-chip ${activeTarget === null ? 'active' : ''}" data-target="">クリア</button>`;
  targetFiltersEl.querySelectorAll('.adv-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTarget = btn.dataset.target || null;
      buildTargetFilters();
      render();
    });
  });
}

function matchesSearch(g, q) {
  if (!q) return true;
  const haystack = [g.title, g.id, g.test_base, g.design_notes, ...g.tags, ...g.subdomains, DOMAIN_INFO[g.domain]?.name].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t => haystack.includes(t));
}

function matchesFilter(g) {
  if (activeFilter === 'new') { if (!g.is_new) return false; }
  else if (activeFilter !== 'all') { if (g.domain !== activeFilter) return false; }
  if (activeSub && !g.subdomains.includes(activeSub)) return false;
  if (activeTarget && !g.targets.includes(activeTarget)) return false;
  return true;
}

function badge(g) {
  if (g.category === 'rehabilitation') return '<span class="badge-rehab">REHAB</span>';
  if (g.category === 'simple') return '<span class="badge-simple">SIMPLE</span>';
  return '';
}

function render() {
  const filtered = GAMES.filter(g => matchesFilter(g) && matchesSearch(g, searchQuery));
  if (filtered.length === 0) {
    main.innerHTML = '';
    main.appendChild(empty);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const byDomain = {};
  for (const g of filtered) {
    (byDomain[g.domain] = byDomain[g.domain] || []).push(g);
  }
  let html = '';
  for (const dom of DOMAIN_ORDER) {
    const list = byDomain[dom];
    if (!list || list.length === 0) continue;
    const info = DOMAIN_INFO[dom];
    html += `
      <section class="domain-section" data-domain="${dom}" style="color:${info.color};">
        <div class="domain-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="icon">${info.icon}</span>
          <span class="name" style="color:${info.color};">${info.name}</span>
          <span class="desc">${info.desc}</span>
          <span class="count">${list.length}本</span>
          <span class="toggle">▼</span>
        </div>
        <div class="grid">
          ${list.map(g => `
            <a class="card" href="${g.file}" data-domain="${g.domain}" data-cat="${g.category}">
              ${badge(g)}
              <div class="title" style="color:${info.color};">${escapeHtml(g.title)}</div>
              <div class="meta">
                <span>${g.test_base ? escapeHtml(g.test_base) : (g.tags[0] ? escapeHtml(g.tags[0]) : info.name)}</span>
                <span class="duration">⏱ ${g.duration}分</span>
              </div>
            </a>`).join('')}
        </div>
      </section>`;
  }
  main.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

buildFilters();
buildSubFilters();
buildTargetFilters();
render();
</script>
