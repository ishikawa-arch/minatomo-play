<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>どこだった？ | みなともPlay</title>
<meta name="description" content="どこに何があったか、思い出してみましょう。 頭の中の地図を、そっと開いて。 | みなともPlay">
<meta name="minatomo-domain" content="memory">
<meta name="minatomo-category" content="シンプル">
<meta name="minatomo-source" content="jsx-build-20260425T100701">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
<meta name="minatomo-id" content="minatomo-simple-wherewasite">
<meta name="minatomo-domain-primary" content="memory">
<meta name="minatomo-domain-subdomains" content="spatial_memory">
<meta name="minatomo-target" content="moderate_dementia,mild_dementia,stroke_chronic">
<meta name="minatomo-difficulty-levels" content="1,2,3">
<meta name="minatomo-duration" content="3">
<meta name="minatomo-completion-status" content="auto_filled">
<meta name="minatomo-applied-patterns" content="P8">
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">

// ========== 【シンプル】どこだった？ ==========
const EMOJIS = ['🍎','🐱','⭐','🌸','🚗','🎈','🐟','🍰','❤️','🐸','🌻','🎵'];

function genRounds(count) {
  const rounds = [];
  for (let i = 0; i < count; i++) {
    let numTargets;
    if (i < 4) numTargets = 1;
    else if (i < 8) numTargets = 2;
    else numTargets = 3;

    // Pick random cells in 3x3 grid
    const all = [0,1,2,3,4,5,6,7,8];
    const shuffled = [];
    const tmp = [...all];
    while (tmp.length) {
      const idx = Math.floor(Math.random() * tmp.length);
      shuffled.push(tmp.splice(idx, 1)[0]);
    }
    const targets = shuffled.slice(0, numTargets);
    const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    // Show time: shorter for later rounds
    const showTime = Math.max(800, 2000 - i * 90);

    rounds.push({ targets, emoji, numTargets, showTime });
  }
  return rounds;
}

function App() {
  const [screen, setScreen] = React.useState('start');
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    rounds:[], currentR:0, score:0, correct:0,
    phase:'idle', // showing, picking, feedback
    picked: new Set(),
    feedback:null,
  }).current;

  const timerRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(timerRef.current), []);

  const startGame = () => {
    g.rounds = genRounds(12);
    g.currentR = 0; g.score = 0; g.correct = 0;
    g.picked = new Set(); g.feedback = null;
    setScreen('play'); rerender();
    startRound(0);
  };

  const startRound = (idx) => {
    g.currentR = idx;
    g.picked = new Set();
    g.feedback = null;
    g.phase = 'showing';
    rerender();

    timerRef.current = setTimeout(() => {
      g.phase = 'picking';
      rerender();
    }, g.rounds[idx].showTime);
  };

  const handleTap = (cellIdx) => {
    if (g.phase !== 'picking' || g.picked.has(cellIdx) || g.feedback) return;
    const round = g.rounds[g.currentR];
    const isTarget = round.targets.includes(cellIdx);

    g.picked.add(cellIdx);

    if (!isTarget) {
      // Wrong cell
      g.feedback = 'wrong';
      rerender();
      timerRef.current = setTimeout(nextRound, 1500);
      return;
    }

    rerender();

    // Check if all found
    const allFound = round.targets.every(t => g.picked.has(t));
    if (allFound) {
      g.feedback = 'correct';
      g.correct++;
      g.score += 10 * round.numTargets;
      rerender();
      timerRef.current = setTimeout(nextRound, 800);
    }
  };

  const nextRound = () => {
    if (g.currentR + 1 >= g.rounds.length) {
      setScreen('done'); rerender();
    } else {
      startRound(g.currentR + 1);
    }
  };

  const round = g.currentR < g.rounds.length ? g.rounds[g.currentR] : null;
  const bs = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.15s' };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF8', minHeight:'100vh', color:'#333' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop{0%{transform:scale(0.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(232,101,46,0.3)}50%{box-shadow:0 0 0 10px rgba(232,101,46,0)}}
        @media(min-width:768px){#root{zoom:1.25}}@media(min-width:1200px){#root{zoom:1.8}}@media(min-width:1920px){#root{zoom:2.4}}
      `}</style>

      <div style={{ background:'white', padding:'10px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 1px 4px rgba(0,0,0,0.03)' }}>
        <span style={{ fontSize:18, fontWeight:900, color:'#E8652E', letterSpacing:'0.08em' }}>📍 どこだった？</span>
        {screen === 'play' && (
          <span style={{ fontSize:14, fontWeight:800, color:'white', background:'#888', padding:'4px 12px', borderRadius:50 }}>{g.currentR + 1} / {g.rounds.length}</span>
        )}
      </div>

      {/* START */}
      {screen === 'start' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:6, marginBottom:20 }}>
            {[0,1,2,3,4,5,6,7,8].map(i => (
              <div key={i} style={{
                width:48, height:48, borderRadius:12,
                background: i === 4 ? '#FFF3E0' : '#F5F5F0',
                border: `3px solid ${i === 4 ? '#E8652E' : '#E8E8E8'}`,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:28,
              }}>{i === 4 ? '⭐' : ''}</div>
            ))}
          </div>
          <div style={{ fontSize:14, color:'#E8652E', fontWeight:700, marginBottom:20 }}>↓ きえたあと ↓ どこにいた？</div>

          <div style={{ fontSize:26, fontWeight:900, color:'#333', marginBottom:8, letterSpacing:'0.06em' }}>
            ばしょをおぼえてタップ！
          </div>
          <div style={{ fontSize:16, color:'#9E9E9E', marginBottom:40 }}>
            どこにいたかおぼえよう
          </div>

          <button onClick={startGame} style={{
            ...bs, fontSize:28, fontWeight:900, color:'white',
            background:'#E8652E', border:'none',
            padding:'24px 64px', borderRadius:60,
            boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
          }}>はじめる</button>
        </div>
      )}

      {/* PLAY */}
      {screen === 'play' && round && (
        <div style={{ padding:'16px', maxWidth:580, margin:'0 auto' }}>
          <div style={{ display:'flex', gap:3, justifyContent:'center', marginBottom:12 }}>
            {g.rounds.map((_, i) => (
              <div key={i} style={{
                width: i === g.currentR ? 12 : 8, height:8, borderRadius:4,
                background: i < g.currentR ? '#8BC34A' : i === g.currentR ? '#E8652E' : '#E0E0E0',
              }} />
            ))}
          </div>

          <div style={{ textAlign:'center', marginBottom:12 }}>
            <span style={{ fontFamily:'Outfit,sans-serif', fontSize:24, fontWeight:900, color:'#E8652E' }}>{g.score}</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#9E9E9E', marginLeft:4 }}>てん</span>
          </div>

          {/* Phase text */}
          <div style={{ textAlign:'center', marginBottom:8, minHeight:36 }}>
            {g.phase === 'showing' && (
              <span style={{ fontSize:20, fontWeight:900, color:'#E8652E', animation:'fadeUp 0.3s' }}>おぼえてね！</span>
            )}
            {g.phase === 'picking' && !g.feedback && (
              <div style={{ animation:'fadeUp 0.3s' }}>
                <span style={{ fontSize:20, fontWeight:900, color:'#333' }}>どこだった？</span>
                {round.numTargets > 1 && (
                  <span style={{ fontSize:14, fontWeight:700, color:'#E8652E', marginLeft:6 }}>あと{round.numTargets - g.picked.size}つ</span>
                )}
              </div>
            )}
            {g.feedback === 'correct' && <span style={{ fontSize:40, animation:'pop 0.3s' }}>⭕</span>}
            {g.feedback === 'wrong' && <span style={{ fontSize:40, animation:'shake 0.3s' }}>❌</span>}
          </div>

          {/* 3x3 Grid */}
          <div style={{
            display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10,
            maxWidth:310, margin:'0 auto',
          }} key={g.currentR}>
            {[0,1,2,3,4,5,6,7,8].map(cellIdx => {
              const isTarget = round.targets.includes(cellIdx);
              const isPicked = g.picked.has(cellIdx);
              const showEmoji = g.phase === 'showing' && isTarget;
              const showCorrect = g.feedback && isTarget;
              const showWrong = g.feedback === 'wrong' && isPicked && !isTarget;

              return (
                <button key={cellIdx}
                  onClick={() => handleTap(cellIdx)}
                  style={{
                    ...bs,
                    height:90, borderRadius:18,
                    background: showEmoji ? '#FFF3E0'
                      : showCorrect ? '#F1F8E9'
                      : showWrong ? '#FFF5F5'
                      : isPicked ? '#F1F8E9'
                      : 'white',
                    border: `4px solid ${
                      showEmoji ? '#E8652E'
                      : showCorrect ? '#66BB6A'
                      : showWrong ? '#EF5350'
                      : isPicked ? '#66BB6A'
                      : '#E8E8E8'
                    }`,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    animation: showEmoji ? 'glow 1.2s ease-in-out infinite'
                      : showWrong ? 'shake 0.3s'
                      : showCorrect ? 'pop 0.3s'
                      : undefined,
                    opacity: g.feedback && !showCorrect && !showWrong ? 0.3 : 1,
                    boxShadow:'0 2px 8px rgba(0,0,0,0.04)',
                    pointerEvents: (g.phase === 'picking' && !g.feedback && !isPicked) ? 'auto' : 'none',
                  }}>
                  {/* Show emoji during showing or feedback reveal */}
                  {(showEmoji || showCorrect) && (
                    <span style={{ fontSize:42, lineHeight:1 }}>{round.emoji}</span>
                  )}
                  {/* Check mark for correctly picked */}
                  {isPicked && !g.feedback && (
                    <span style={{ fontSize:28 }}>✓</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* DONE */}
      {screen === 'done' && (() => {
        const total = g.rounds.length;
        const pct = g.correct / total;
        const emoji = pct >= 0.8 ? '🎉' : pct >= 0.5 ? '👍' : '😊';
        const msg = pct >= 0.8 ? 'すごい！' : pct >= 0.5 ? 'いいね！' : 'またやろう！';
        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
            <div style={{ fontSize:80, marginBottom:16, animation:'pop 0.6s ease-out' }}>{emoji}</div>
            <div style={{ fontSize:32, fontWeight:900, color:'#E8652E', marginBottom:12 }}>{msg}</div>
            <div style={{ background:'white', borderRadius:24, padding:'20px 40px', boxShadow:'0 4px 16px rgba(0,0,0,0.06)', marginBottom:12 }}>
              <div style={{ fontFamily:'Outfit,sans-serif', fontSize:48, fontWeight:900, color:'#E8652E' }}>
                {g.score}<span style={{ fontSize:20, color:'#9E9E9E' }}>てん</span>
              </div>
            </div>
            <div style={{ fontSize:20, fontWeight:700, color:'#6B6B6B', marginBottom:40 }}>{g.correct}もん せいかい / {total}もん</div>
            <button onClick={startGame} style={{
              ...bs, fontSize:24, fontWeight:900, color:'white',
              background:'#E8652E', border:'none',
              padding:'22px 48px', borderRadius:60,
              boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
            }}>もういちど</button>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
