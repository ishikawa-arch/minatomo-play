<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>右左クイズ | みなともPlay</title>
<meta name="description" content="左右の判断を素早く - 無料リハビリゲーム みなともPlay">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
<meta name="minatomo-id" content="minatomo-left-right">
<meta name="minatomo-domain-primary" content="visuospatial">
<meta name="minatomo-domain-subdomains" content="left_right_discrimination,visual_perception">
<meta name="minatomo-target" content="stroke_subacute,stroke_chronic,tbi,mci,mild_dementia,healthy_elderly">
<meta name="minatomo-difficulty-levels" content="1,2,3">
<meta name="minatomo-duration" content="5">
<meta name="minatomo-completion-status" content="auto_filled">
<meta name="minatomo-applied-patterns" content="P4">
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">
// ========== DATA ==========
function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

// ========== QUESTION GENERATORS ==========

// Mode 1: Arrow direction
function genArrow() {
  const dirs = [
    { angle:0, answer:'右', emoji:'→' },
    { angle:180, answer:'左', emoji:'←' },
    { angle:90, answer:'下', emoji:'↓' },
    { angle:-90, answer:'上', emoji:'↑' },
  ];
  const d = dirs[Math.floor(Math.random() * dirs.length)];
  return {
    mode:'arrow', question:'矢印はどっち向き？',
    visual:{ type:'arrow', angle:d.angle },
    answer:d.answer,
    opts:shuffle(['右','左','上','下']),
  };
}

// Mode 2: Which hand?
function genHand() {
  const isLeft = Math.random() < 0.5;
  return {
    mode:'hand', question:'これはどっちの手？',
    visual:{ type:'hand', isLeft },
    answer:isLeft ? '左手' : '右手',
    opts:shuffle(['左手','右手']),
  };
}

// Mode 3: Which side has more?
function genSideCount() {
  const leftCount = 1 + Math.floor(Math.random() * 5);
  let rightCount;
  do { rightCount = 1 + Math.floor(Math.random() * 5); } while (rightCount === leftCount);
  const emojis = ['🍎','⭐','🔵','🟡','❤️','🌸','🍊','💚'];
  const emoji = emojis[Math.floor(Math.random() * emojis.length)];
  const answer = leftCount > rightCount ? '左' : '右';
  return {
    mode:'sidecount', question:`${emoji}が多いのはどっち側？`,
    visual:{ type:'sidecount', leftCount, rightCount, emoji },
    answer,
    opts:shuffle(['左','右']),
  };
}

// Mode 4: Follow direction instructions
function genInstruction() {
  const scenarios = [
    { text:'あなたは北を向いています。右を向くとどっち？', answer:'東', opts:['東','西','南','北'] },
    { text:'あなたは北を向いています。左を向くとどっち？', answer:'西', opts:['東','西','南','北'] },
    { text:'あなたは南を向いています。右を向くとどっち？', answer:'西', opts:['東','西','南','北'] },
    { text:'あなたは南を向いています。左を向くとどっち？', answer:'東', opts:['東','西','南','北'] },
    { text:'あなたは東を向いています。右を向くとどっち？', answer:'南', opts:['東','西','南','北'] },
    { text:'あなたは西を向いています。右を向くとどっち？', answer:'北', opts:['東','西','南','北'] },
  ];
  const s = scenarios[Math.floor(Math.random() * scenarios.length)];
  return { mode:'instruction', question:s.text, visual:null, answer:s.answer, opts:shuffle(s.opts) };
}

// Mode 5: Rotated arrow
function genRotatedArrow() {
  const baseDir = Math.random() < 0.5 ? 'right' : 'left';
  const rotation = [0, 90, 180, 270][Math.floor(Math.random() * 4)];
  // Calculate actual direction after rotation
  const dirMap = {
    'right-0':'右', 'right-90':'下', 'right-180':'左', 'right-270':'上',
    'left-0':'左', 'left-90':'上', 'left-180':'右', 'left-270':'下',
  };
  const answer = dirMap[`${baseDir}-${rotation}`];
  return {
    mode:'rotated', question:'この矢印はどっち向き？',
    visual:{ type:'rotatedArrow', baseDir, rotation },
    answer,
    opts:shuffle(['右','左','上','下']),
  };
}

// Mode 6: Object position
function genPosition() {
  const objects = [
    { emoji:'🍎', name:'りんご' },
    { emoji:'📕', name:'本' },
    { emoji:'⭐', name:'星' },
    { emoji:'🔑', name:'カギ' },
    { emoji:'🎵', name:'おんぷ' },
    { emoji:'🌸', name:'花' },
  ];
  const obj = objects[Math.floor(Math.random() * objects.length)];
  const isLeft = Math.random() < 0.5;
  const isTop = Math.random() < 0.5;
  const answer = isLeft ? '左' : '右';
  return {
    mode:'position', question:`${obj.emoji}はどっち側にある？`,
    visual:{ type:'position', emoji:obj.emoji, isLeft, isTop },
    answer,
    opts:shuffle(['左','右']),
  };
}

// Mode 7: Mirror - which hand is raised?
// Mode 8: Turn counting
function genTurns() {
  const turns = [];
  const count = 2 + Math.floor(Math.random() * 3);
  let facing = 0; // 0=north, 1=east, 2=south, 3=west
  const dirNames = ['北','東','南','西'];

  for (let i = 0; i < count; i++) {
    const turnRight = Math.random() < 0.5;
    turns.push(turnRight ? '右' : '左');
    facing = turnRight ? (facing + 1) % 4 : (facing + 3) % 4;
  }

  const turnText = turns.map((t, i) => `${i+1}回目：${t}に曲がる`).join('、');
  return {
    mode:'turns', question:`北を向いてスタート。${turnText}。今どっちを向いている？`,
    visual:null,
    answer:dirNames[facing],
    opts:shuffle([...dirNames]),
  };
}

const DIFF = {
  easy:   { label:'かんたん', emoji:'🌱', desc:'矢印・左右の判断', rounds:10, modes:['arrow','hand','position','sidecount'] },
  normal: { label:'ふつう', emoji:'🌿', desc:'方角・回転矢印も', rounds:12, modes:['arrow','hand','position','sidecount','rotated','instruction'] },
  hard:   { label:'むずかしい', emoji:'🌳', desc:'連続回転・方角・8秒', rounds:14, modes:['arrow','rotated','instruction','turns','sidecount','hand','position'], timeLimit:8 },
};

function generateQ(diff) {
  const cfg = DIFF[diff];
  const mode = cfg.modes[Math.floor(Math.random() * cfg.modes.length)];
  switch(mode) {
    case 'arrow': return genArrow();
    case 'hand': return genHand();
    case 'sidecount': return genSideCount();
    case 'instruction': return genInstruction();
    case 'rotated': return genRotatedArrow();
    case 'position': return genPosition();
    case 'turns': return genTurns();
    default: return genArrow();
  }
}

const MODE_LABELS = {
  arrow:{ icon:'➡️', name:'矢印' },
  hand:{ icon:'✋', name:'左右の手' },
  sidecount:{ icon:'🔢', name:'どっちが多い' },
  instruction:{ icon:'🧭', name:'方角' },
  rotated:{ icon:'🔄', name:'回転矢印' },
  position:{ icon:'📍', name:'どっち側' },
  turns:{ icon:'🔀', name:'連続回転' },
};

// ========== VISUAL COMPONENTS ==========
function QuestionVisual({ visual }) {
  if (!visual) return null;

  if (visual.type === 'arrow') {
    return (
      <div style={{ display:'flex', justifyContent:'center', padding:'20px 0' }}>
        <div style={{ width:100, height:100, borderRadius:'50%', background:'#FF6B35', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 16px rgba(255,107,53,0.3)', transform:`rotate(${visual.angle}deg)` }}>
          <span style={{ fontSize:48, color:'white' }}>➡️</span>
        </div>
      </div>
    );
  }

  if (visual.type === 'hand') {
    return (
      <div style={{ display:'flex', justifyContent:'center', padding:'16px 0' }}>
        <div style={{ fontSize:80, transform:visual.isLeft ? 'scaleX(-1)' : 'scaleX(1)' }}>🤚</div>
      </div>
    );
  }

  if (visual.type === 'sidecount') {
    const leftItems = Array(visual.leftCount).fill(visual.emoji);
    const rightItems = Array(visual.rightCount).fill(visual.emoji);
    return (
      <div style={{ display:'flex', justifyContent:'center', gap:4, padding:'16px 0', alignItems:'center' }}>
        <div style={{ flex:1, textAlign:'center', padding:'12px', background:'#E3F2FD', borderRadius:12, minHeight:60 }}>
          <div style={{ fontSize:14, fontWeight:700, color:'#1565C0', marginBottom:4 }}>← 左</div>
          <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:4 }}>
            {leftItems.map((e,i) => <span key={i} style={{ fontSize:28 }}>{e}</span>)}
          </div>
        </div>
        <div style={{ width:3, height:60, background:'#E0E0E0', borderRadius:2, flexShrink:0 }} />
        <div style={{ flex:1, textAlign:'center', padding:'12px', background:'#FFF3E0', borderRadius:12, minHeight:60 }}>
          <div style={{ fontSize:14, fontWeight:700, color:'#E65100', marginBottom:4 }}>右 →</div>
          <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:4 }}>
            {rightItems.map((e,i) => <span key={i} style={{ fontSize:28 }}>{e}</span>)}
          </div>
        </div>
      </div>
    );
  }

  if (visual.type === 'rotatedArrow') {
    const baseAngle = visual.baseDir === 'right' ? 0 : 180;
    return (
      <div style={{ display:'flex', justifyContent:'center', padding:'20px 0' }}>
        <div style={{ width:100, height:100, borderRadius:16, background:'linear-gradient(135deg,#7B1FA2,#AB47BC)', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 16px rgba(123,31,162,0.3)', transform:`rotate(${baseAngle + visual.rotation}deg)` }}>
          <span style={{ fontSize:48, color:'white' }}>➡️</span>
        </div>
      </div>
    );
  }

  if (visual.type === 'position') {
    return (
      <div style={{ position:'relative', width:'100%', height:120, background:'#F5F5F5', borderRadius:14, overflow:'hidden' }}>
        <div style={{ position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', width:2, height:'80%', background:'#E0E0E0' }} />
        <div style={{ position:'absolute', top:visual.isTop?'20%':'60%', left:visual.isLeft?'25%':'75%', transform:'translate(-50%,-50%)', fontSize:52 }}>
          {visual.emoji}
        </div>
        <div style={{ position:'absolute', bottom:6, left:10, fontSize:13, color:'#9E9E9E', fontWeight:700 }}>← 左</div>
        <div style={{ position:'absolute', bottom:6, right:10, fontSize:13, color:'#9E9E9E', fontWeight:700 }}>右 →</div>
      </div>
    );
  }

  return null;
}

// ========== MAIN ==========
function App() {
  const [screen, setScreen] = React.useState('select');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [history, setHistory] = React.useState([]);
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    phase:'idle',
    questions:[], currentQ:0,
    score:0, correct:0,
    selected:null, feedback:null,
    results:[], timeLeft:0,
  }).current;

  const timerRef = React.useRef(null);
  const intervalRef = React.useRef(null);
  React.useEffect(() => () => { clearTimeout(timerRef.current); clearInterval(intervalRef.current); }, []);

  const startGame = (diff) => {
    setDifficulty(diff);
    const cfg = DIFF[diff];
    const questions = [];
    for (let i = 0; i < cfg.rounds; i++) questions.push(generateQ(diff));
    g.questions = questions; g.currentQ = 0; g.score = 0; g.correct = 0;
    g.selected = null; g.feedback = null; g.results = [];
    g.phase = 'playing';
    setShowConfetti(false); setScreen('game');
    if (cfg.timeLimit) startTimer(cfg.timeLimit);
    rerender();
  };

  const startTimer = (sec) => {
    g.timeLeft = sec;
    clearInterval(intervalRef.current);
    intervalRef.current = setInterval(() => {
      g.timeLeft--; rerender();
      if (g.timeLeft <= 0) {
        clearInterval(intervalRef.current);
        if (!g.feedback) {
          g.feedback = 'timeout';
          g.results.push({ q:g.questions[g.currentQ], correct:false });
          rerender();
          timerRef.current = setTimeout(() => nextQ(), 1500);
        }
      }
    }, 1000);
  };

  const handleAnswer = (opt) => {
    if (g.selected !== null || g.feedback) return;
    clearInterval(intervalRef.current);
    const q = g.questions[g.currentQ];
    g.selected = opt;
    const isCorrect = opt === q.answer;
    if (isCorrect) { g.score += 10; g.correct++; g.feedback = 'correct'; }
    else { g.feedback = 'wrong'; }
    g.results.push({ q, correct:isCorrect });
    rerender();
    timerRef.current = setTimeout(() => nextQ(), isCorrect ? 600 : 1500);
  };

  const nextQ = () => {
    if (g.currentQ+1 >= g.questions.length) { finishGame(); return; }
    g.currentQ++; g.selected = null; g.feedback = null;
    const cfg = DIFF[difficulty];
    if (cfg.timeLimit) startTimer(cfg.timeLimit);
    rerender();
  };

  const finishGame = () => {
    clearInterval(intervalRef.current);
    g.phase = 'result'; rerender();
    const pct = g.correct / g.questions.length;
    if (pct >= 0.7) { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 4000); }
    setHistory(prev => [{ diff:difficulty, correct:g.correct, total:g.questions.length, score:g.score, date:new Date().toISOString() }, ...prev].slice(0, 20));
    setScreen('result');
  };

  const goBack = () => { clearTimeout(timerRef.current); clearInterval(intervalRef.current); g.phase = 'idle'; setScreen('select'); rerender(); };

  const cfg = DIFF[difficulty] || DIFF.normal;
  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };

  const ConfettiEl = showConfetti ? (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:999, overflow:'hidden' }}>
      <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`}</style>
      {Array.from({length:50},(_,i) => (
        <div key={i} style={{ position:'absolute', top:-10, left:Math.random()*100+'%', width:6+Math.random()*8, height:6+Math.random()*8, background:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], borderRadius:Math.random()>0.5?'50%':2, animation:`cf ${2+Math.random()*2}s linear ${Math.random()*1.5}s forwards` }} />
      ))}
    </div>
  ) : null;

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF7', minHeight:'100vh', color:'#2D2D2D' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px'}}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#FF6B35' }}>🧭 右左クイズ</span>
        </div>
        {screen === 'game' && (
          <div style={{ display:'flex', gap:6 }}>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#2EC4B6', padding:'3px 10px', borderRadius:50 }}>{g.currentQ+1}/{g.questions.length}</span>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#FF6B35', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
          </div>
        )}
      </div>

      {/* ===== SELECT ===== */}
      {screen === 'select' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16, animation:'bounce 2s infinite' }}>🧭</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:6 }}>右左クイズ</div>
          <div style={{ fontSize:15, color:'#6B6B6B', marginBottom:8, lineHeight:1.7 }}>右？左？上？下？<br/>すばやく判断しよう！</div>
          <div style={{ fontSize:13, color:'#9E9E9E', marginBottom:28, background:'#FFF3E0', padding:'8px 16px', borderRadius:12 }}>🧠 空間認知・左右弁別のトレーニングです</div>

          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'18px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'left' }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🎯 遊び方</div>
            <div style={{ fontSize:14, color:'#6B6B6B', lineHeight:2 }}>
              ① 矢印や手、絵が出てきます<br/>
              ② 「右？左？」すばやく答えよう<br/>
              ③ 方角や回転問題もあります<br/>
              ④ 向かい合わせのひっかけに注意！
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'14px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)' }}>
            <div style={{ fontSize:12, fontWeight:700, color:'#6B6B6B', marginBottom:8, textAlign:'left' }}>📝 こんな問題が出ます</div>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap', justifyContent:'center' }}>
              {Object.entries(MODE_LABELS).map(([k,m]) => (
                <span key={k} style={{ fontSize:11, fontWeight:700, padding:'5px 10px', borderRadius:50, background:'#F5F5F5' }}>
                  {m.icon} {m.name}
                </span>
              ))}
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420 }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度を選んでスタート</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {Object.entries(DIFF).map(([k,d]) => (
                <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'3px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left'}}>
                  <span style={{ fontSize:26 }}>{d.emoji}</span>
                  <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
                </button>
              ))}
            </div>
          </div>

          {history.length > 0 && (
            <div style={{ width:'100%', maxWidth:420, marginTop:28, textAlign:'left' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
              {history.slice(0,5).map((h,i) => {
                const hc = DIFF[h.diff]; const d = new Date(h.date);
                return (
                  <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                      <div><div style={{fontSize:12,fontWeight:700}}>{hc.label}・{h.correct}/{h.total}正解</div><div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div></div>
                    </div>
                    <div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#FF6B35'}}>{h.score}pt</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ===== GAME ===== */}
      {screen === 'game' && g.phase === 'playing' && (() => {
        const q = g.questions[g.currentQ];
        if (!q) return null;
        const answered = g.selected !== null || g.feedback !== null;
        const ml = MODE_LABELS[q.mode] || { icon:'🧭', name:'右左' };

        return (
          <div style={{ padding:'0 16px', maxWidth:500, margin:'0 auto' }}>
            {/* Status */}
            <div style={{ display:'flex', justifyContent:'center', gap:16, padding:'8px 14px', background:'white', borderBottom:'1px solid #F0F0F0', borderRadius:'0 0 12px 12px', marginBottom:8 }}>
              {[
                {v:g.score,l:'スコア',c:'#FF6B35'},
                {v:g.correct+'/'+(g.currentQ+(answered?1:0)),l:'正解',c:'#2EC4B6'},
                {v:(g.currentQ+1)+'/'+g.questions.length,l:'問題',c:'#7B1FA2'},
                ...(cfg.timeLimit && !answered ? [{v:g.timeLeft+'秒',l:'残り',c:g.timeLeft<=3?'#E53935':'#6B6B6B'}] : []),
              ].map((s,i) => (
                <div key={i} style={{ textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:s.c, animation:s.l==='残り'&&g.timeLeft<=3?'pulse 0.3s infinite':undefined }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E' }}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Progress */}
            <div style={{ display:'flex', gap:2, marginBottom:8 }}>
              {g.questions.map((_,i) => (
                <div key={i} style={{ flex:1, height:4, borderRadius:2, background: i<g.results.length?(g.results[i].correct?'#66BB6A':'#EF5350'):i===g.currentQ?'#FFB74D':'#E8E8E8' }} />
              ))}
            </div>

            {/* Timer */}
            {cfg.timeLimit > 0 && !answered && (
              <div style={{ width:'100%', height:4, background:'#E8E8E8', borderRadius:2, marginBottom:8, overflow:'hidden' }}>
                <div style={{ width:(g.timeLeft/cfg.timeLimit*100)+'%', height:'100%', background:g.timeLeft<=3?'#E53935':'linear-gradient(90deg,#FF6B35,#FF8F5E)', borderRadius:2, transition:'width 1s linear' }} />
              </div>
            )}

            <div style={{ animation:'fadeUp 0.25s ease-out' }} key={g.currentQ}>
              {/* Mode badge */}
              <div style={{ textAlign:'center', marginBottom:6 }}>
                <span style={{ fontSize:14, fontWeight:700, color:'#6B6B6B', background:'#F5F5F5', padding:'5px 14px', borderRadius:50 }}>
                  {ml.icon} {ml.name}
                </span>
              </div>

              {/* Visual */}
              <div style={{ background:'white', borderRadius:18, padding:'14px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', marginBottom:10 }}>
                <div style={{ fontSize:22, fontWeight:900, color:'#2D2D2D', lineHeight:1.6, textAlign:'center', marginBottom: q.visual ? 4 : 0 }}>{q.question}</div>
                {q.note && <div style={{ fontSize:13, color:'#9E9E9E', textAlign:'center' }}>{q.note}</div>}
                <QuestionVisual visual={q.visual} />
              </div>

              {/* Options */}
              <div style={{ display:'grid', gridTemplateColumns:`repeat(${q.opts.length <= 2 ? 2 : 2},1fr)`, gap:8 }}>
                {q.opts.map((opt,i) => {
                  const isSelected = g.selected === opt;
                  const isCorrect = opt === q.answer;
                  return (
                    <button key={i} onClick={() => handleAnswer(opt)} disabled={answered}
                      style={{...btnBase, fontSize:22, fontWeight:900, padding:'20px 14px', borderRadius:14, textAlign:'center',
                        border:`3px solid ${answered&&isCorrect?'#66BB6A':answered&&isSelected&&!isCorrect?'#EF5350':'#E8E8E8'}`,
                        background:answered&&isCorrect?'#E8F5E9':answered&&isSelected&&!isCorrect?'#FFEBEE':'white',
                        opacity:answered&&!isCorrect&&!isSelected?0.3:1,
                        color:answered&&isCorrect?'#2E7D32':answered&&isSelected&&!isCorrect?'#C62828':'#2D2D2D'}}>
                      {opt} {answered && isCorrect ? '✅' : ''}
                    </button>
                  );
                })}
              </div>

              {g.feedback === 'wrong' && (
                <div style={{ textAlign:'center', marginTop:10, fontSize:16, fontWeight:700, color:'#C62828' }}>❌ 正解は「{q.answer}」</div>
              )}
              {g.feedback === 'timeout' && (
                <div style={{ textAlign:'center', marginTop:10, fontSize:16, fontWeight:700, color:'#E65100' }}>⏰ 時間切れ！正解は「{q.answer}」</div>
              )}
            </div>
            <div style={{ height:20 }} />
          </div>
        );
      })()}

      {/* ===== RESULT ===== */}
      {screen === 'result' && (() => {
        const total = g.questions.length;
        const pct = total > 0 ? g.correct / total : 0;
        const stars = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.55 ? '⭐⭐' : '⭐';
        const msg = pct >= 0.85 ? '方向感覚バッチリ！' : pct >= 0.55 ? 'よくできました！' : 'もう一度挑戦！';

        const modeStats = {};
        g.results.forEach(r => { const m = r.q.mode; if (!modeStats[m]) modeStats[m] = {t:0,c:0}; modeStats[m].t++; if(r.correct) modeStats[m].c++; });

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'30px 20px', textAlign:'center' }}>
            <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:4 }}>{msg}</div>
            <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:24 }}>{cfg.label}モード</div>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:24 }}>
              {[{v:`${g.correct}/${total}`,l:'正解数'},{v:Math.round(pct*100)+'%',l:'正答率'},{v:g.score,l:'スコア'}].map((s,i) =>
                <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:24, fontWeight:800, color:'#FF6B35' }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
                </div>
              )}
            </div>

            <div style={{ display:'flex', gap:8, flexWrap:'wrap', justifyContent:'center', marginBottom:24, width:'100%', maxWidth:360 }}>
              {Object.entries(modeStats).map(([m,s]) => {
                const ml = MODE_LABELS[m];
                return (
                  <div key={m} style={{ background:'white', borderRadius:12, padding:'8px 12px', boxShadow:'0 2px 8px rgba(0,0,0,0.04)', textAlign:'center', minWidth:65 }}>
                    <div style={{ fontSize:14 }}>{ml?.icon}</div>
                    <div style={{ fontSize:9, fontWeight:700, color:'#6B6B6B' }}>{ml?.name}</div>
                    <div style={{ fontFamily:'Outfit', fontSize:16, fontWeight:800, marginTop:2 }}>{s.c}/{s.t}</div>
                  </div>
                );
              })}
            </div>

            <div style={{ width:'100%', maxWidth:420, marginBottom:24, padding:'14px 16px', background:'#F5F5F5', borderRadius:12, textAlign:'left' }}>
              <div style={{ fontSize:12, fontWeight:700, color:'#6B6B6B', marginBottom:6 }}>💡 右左のコツ</div>
              <div style={{ fontSize:11, color:'#9E9E9E', lineHeight:1.8 }}>
                迷ったら「お箸を持つ手が右手」など自分の体で確認しましょう。向かい合っている人の右左は反対になることに注意！方角は「北を上にした地図」をイメージすると考えやすくなります。
              </div>
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300 }}>
              <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60}}>もう一度プレイ 🔄</button>
              <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60}}>設定を変える</button>
            </div>
          </div>
        );
      })()}

      {ConfettiEl}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
