    { items:['いちご','メロン','チョコレート','バニラ'], odd:'チョコレート', category:'アイスの味（果物系）', reason:'チョコレートは果物ではありません' },
    { items:['ひらがな','カタカナ','漢字','えいご'], odd:'えいご', category:'日本語の文字', reason:'えいごは外国語です' },

    { items:['酸素','窒素','水素','ダイヤモンド'], odd:'ダイヤモンド', category:'気体の元素', reason:'ダイヤモンドは固体（炭素の結晶）です' },
    { items:['わさび','からし','しょうが','こんにゃく'], odd:'こんにゃく', category:'辛い薬味', reason:'こんにゃくは辛くありません' },
    { items:['たいよう','すいせい','かせい','もくせい'], odd:'たいよう', category:'惑星', reason:'たいようは恒星です' },
    { items:['おはし','フォーク','スプーン','おさら'], odd:'おさら', category:'食べる道具', reason:'おさらは盛る道具です' },

// Mode 3: 共通点さがし (what connects these words?)
const COMMON_LINK = {
  easy: [
    { words:['りんご','バナナ','みかん'], answer:'くだもの', opts:['くだもの','やさい','おかし','のみもの'] },
    { words:['いぬ','ねこ','ハムスター'], answer:'ペット', opts:['ペット','やせいどうぶつ','むし','とり'] },

    { words:['さくら','チューリップ','ひまわり'], answer:'はな', opts:['はな','き','むし','はる'] },

  ],

    { words:['しょうゆ','みそ','す'], answer:'ちょうみりょう', opts:['ちょうみりょう','のみもの','えきたい','にほんのもの'] },
    { words:['ピアノ','バイオリン','フルート'], answer:'がっき', opts:['がっき','おもちゃ','にしのもの','おおきいもの'] },

    { words:['こうちゃ','コーヒー','ココア'], answer:'あたたかいのみもの', opts:['あたたかいのみもの','ちゃいろいもの','がいこくのもの','あさのむもの'] },
    { words:['きた','みなみ','ひがし'], answer:'ほうがく', opts:['ほうがく','ばしょ','かぜ','きせつ'] },
  ],

    { words:['あくしゅ','おじぎ','えがお'], answer:'あいさつ', opts:['あいさつ','うんどう','からだ','にほんのぶんか'] },
    { words:['くじら','イルカ','アザラシ'], answer:'うみのほにゅうるい', opts:['うみのほにゅうるい','さかな','おおきないきもの','みずのいきもの'] },
    { words:['かぶき','のう','きょうげん'], answer:'にほんのでんとうげいのう', opts:['にほんのでんとうげいのう','おどり','えんげき','むかしのあそび'] },
    { words:['つる','かめ','まつ'], answer:'えんぎのよいもの', opts:['えんぎのよいもの','いきもの','みどりのもの','おめでたいもの'] },
    { words:['すずめ','メジロ','うぐいす'], answer:'こがた（ちいさい）のとり', opts:['こがた（ちいさい）のとり','うたうとり','にほんのとり','もりのとり'] },

const DIFF = {
  easy:   { label:'かんたん', emoji:'🌱', desc:'やさしいヒント・8問', rounds:8 },
  normal: { label:'ふつう', emoji:'🌿', desc:'少しむずかしい・10問', rounds:10 },
  hard:   { label:'むずかしい', emoji:'🌳', desc:'じっくり考える・12問', rounds:12 },
};

const MODE_INFO = [
  { id:'hint', label:'ヒントで当てよう', icon:'💡', desc:'3つのヒントから言葉を当てる', color:'#FF6B35' },
  { id:'odd', label:'仲間はずれ探し', icon:'🔍', desc:'カテゴリに合わないものを見つける', color:'#7B1FA2' },
  { id:'common', label:'共通点さがし', icon:'🔗', desc:'3つの言葉の共通点を当てる', color:'#2E7D32' },
];

function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function App() {
  const [screen, setScreen] = React.useState('select');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [history, setHistory] = React.useState([]);
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    phase: 'idle',
    questions: [],
    currentQ: 0,
    score: 0,
    correct: 0,
    selected: null,
    feedback: null,
    results: [],
  }).current;

  const timerRef = React.useRef(null);

  const startGame = (diff) => {
    setDifficulty(diff);
    const cfg = DIFF[diff];

    // Mix questions from all 3 modes
    const hintQs = shuffle(HINT_QUESTIONS[diff] || HINT_QUESTIONS.easy).slice(0, Math.ceil(cfg.rounds * 0.4));
    const oddQs = shuffle(ODD_ONE_OUT[diff] || ODD_ONE_OUT.easy).slice(0, Math.ceil(cfg.rounds * 0.3));
    const commonQs = shuffle(COMMON_LINK[diff] || COMMON_LINK.easy).slice(0, Math.ceil(cfg.rounds * 0.3));

    const allQs = shuffle([
      ...hintQs.map(q => ({ ...q, mode: 'hint' })),
      ...oddQs.map(q => ({ ...q, mode: 'odd' })),
      ...commonQs.map(q => ({ ...q, mode: 'common' })),
    ]).slice(0, cfg.rounds);

    // Shuffle options for each question
    allQs.forEach(q => {
      if (q.opts) q.opts = shuffle(q.opts);
      if (q.items) q.items = shuffle(q.items);
    });

    g.questions = allQs;
    g.currentQ = 0;
    g.score = 0;
    g.correct = 0;
    g.selected = null;
    g.feedback = null;
    g.results = [];
    g.phase = 'playing';
    setShowConfetti(false);
    setScreen('game');
    rerender();
  };

  const handleAnswer = (answer) => {
    if (g.selected !== null) return;
    const q = g.questions[g.currentQ];
    g.selected = answer;

    let isCorrect = false;
    if (q.mode === 'hint') isCorrect = answer === q.answer;
    else if (q.mode === 'odd') isCorrect = answer === q.odd;
    else if (q.mode === 'common') isCorrect = answer === q.answer;

    if (isCorrect) {
      g.score += q.mode === 'hint' ? 10 : q.mode === 'odd' ? 12 : 15;
      g.correct++;
    }
    g.feedback = isCorrect ? 'correct' : 'wrong';
    g.results.push({ q, selected: answer, correct: isCorrect });
    rerender();

    timerRef.current = setTimeout(() => {
      if (g.currentQ + 1 >= g.questions.length) {
        finishGame();
      } else {
        g.currentQ++;
        g.selected = null;
        g.feedback = null;
        rerender();
      }
    }, 2000);
  };

  const finishGame = () => {
    g.phase = 'result';
    rerender();
    const pct = g.correct / g.questions.length;
    if (pct >= 0.8) { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 4000); }

    setHistory(prev => [{
      diff: difficulty, correct: g.correct, total: g.questions.length,
      score: g.score, date: new Date().toISOString(),
    }, ...prev].slice(0, 20));
    setScreen('result');
  };

  const goBack = () => {
    clearTimeout(timerRef.current);
    g.phase = 'idle';
    setScreen('select');
    rerender();
  };

  const cfg = DIFF[difficulty] || DIFF.normal;
  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };

  const ConfettiEl = showConfetti ? (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:999, overflow:'hidden' }}>
      <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`}</style>
      {Array.from({length:50},(_,i) => (
        <div key={i} style={{ position:'absolute', top:-10, left:Math.random()*100+'%', width:6+Math.random()*8, height:6+Math.random()*8, background:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], borderRadius:Math.random()>0.5?'50%':2, animation:`cf ${2+Math.random()*2}s linear ${Math.random()*1.5}s forwards` }} />
      ))}
    </div>
  ) : null;

  // Render question based on mode
  const renderQuestion = () => {
    const q = g.questions[g.currentQ];
    if (!q) return null;
    const modeColor = q.mode === 'hint' ? '#FF6B35' : q.mode === 'odd' ? '#7B1FA2' : '#2E7D32';
    const modeBg = q.mode === 'hint' ? '#FFF3E0' : q.mode === 'odd' ? '#F3E5F5' : '#E8F5E9';
    const modeLabel = q.mode === 'hint' ? '💡 ヒントで当てよう' : q.mode === 'odd' ? '🔍 仲間はずれ探し' : '🔗 共通点さがし';

    return (
      <div>
        {/* Mode badge */}
        <div style={{ textAlign:'center', marginBottom:12 }}>
          <span style={{ fontSize:12, fontWeight:700, color:modeColor, background:modeBg, padding:'6px 14px', borderRadius:50 }}>
            {modeLabel}
          </span>
        </div>

        {/* Question card */}
        <div style={{ background:'white', borderRadius:20, padding:'24px 20px', boxShadow:'0 4px 24px rgba(0,0,0,0.06)', marginBottom:16, animation:'fadeUp 0.4s ease-out' }} key={g.currentQ}>

          {/* HINT MODE */}
          {q.mode === 'hint' && (
            <div>
              <div style={{ fontSize:14, fontWeight:700, color:'#6B6B6B', marginBottom:14, textAlign:'center' }}>
                この3つのヒントから<br/>何のことかわかりますか？
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:20 }}>
                {q.hints.map((h, i) => (
                  <div key={i} style={{
                    display:'flex', alignItems:'center', gap:10, padding:'12px 16px',
                    background:'#FFF3E0', borderRadius:12, border:'2px solid #FFE0B2',
                  }}>
                    <span style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:'#FF6B35', flexShrink:0 }}>{i+1}</span>
                    <span style={{ fontSize:15, fontWeight:700, color:'#E65100' }}>{h}</span>
                  </div>
                ))}
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {q.opts.map((opt, i) => {
                  const isSelected = g.selected === opt;
                  const isCorrect = opt === q.answer;
                  const answered = g.selected !== null;
                  return (
                    <button key={i} onClick={() => handleAnswer(opt)} disabled={answered}
                      style={{
                        ...btnBase, fontSize:15, fontWeight:700, padding:'14px 16px', borderRadius:14,
                        border: `3px solid ${answered && isCorrect ? '#66BB6A' : answered && isSelected ? '#EF5350' : '#E8E8E8'}`,
                        background: answered && isCorrect ? '#E8F5E9' : answered && isSelected && !isCorrect ? '#FFEBEE' : 'white',
                        color: answered && isCorrect ? '#2E7D32' : answered && isSelected && !isCorrect ? '#C62828' : '#2D2D2D',
                        opacity: answered && !isCorrect && !isSelected ? 0.5 : 1,
                        textAlign:'left', display:'flex', alignItems:'center', gap:10,
                      }}>
                      <div style={{
                        width:28, height:28, borderRadius:'50%', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:12, fontWeight:700, fontFamily:'Outfit',
                        background: answered && isCorrect ? '#66BB6A' : answered && isSelected && !isCorrect ? '#EF5350' : '#F5F5F5',
                        color: answered && (isCorrect || isSelected) ? 'white' : '#9E9E9E',
                      }}>
                        {answered && isCorrect ? '✓' : answered && isSelected && !isCorrect ? '✗' : String.fromCharCode(65+i)}
                      </div>
                      {opt}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* ODD ONE OUT MODE */}
          {q.mode === 'odd' && (
            <div>
              <div style={{ fontSize:14, fontWeight:700, color:'#6B6B6B', marginBottom:14, textAlign:'center' }}>
                この中で仲間はずれはどれ？
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10, marginBottom:12 }}>
                {q.items.map((item, i) => {
                  const isSelected = g.selected === item;
                  const isOdd = item === q.odd;
                  const answered = g.selected !== null;
                  return (
                    <button key={i} onClick={() => handleAnswer(item)} disabled={answered}
                      style={{
                        ...btnBase, fontSize:16, fontWeight:700, padding:'20px 12px', borderRadius:16,
                        border: `3px solid ${answered && isOdd ? '#7B1FA2' : answered && isSelected && !isOdd ? '#EF5350' : '#E8E8E8'}`,
                        background: answered && isOdd ? '#F3E5F5' : answered && isSelected && !isOdd ? '#FFEBEE' : 'white',
                        color: answered && isOdd ? '#7B1FA2' : answered && isSelected && !isOdd ? '#C62828' : '#2D2D2D',
                        textAlign:'center',
                        opacity: answered && !isOdd && !isSelected ? 0.5 : 1,
                      }}>
                      {item}
                      {answered && isOdd && <div style={{ fontSize:10, color:'#7B1FA2', marginTop:4 }}>仲間はずれ！</div>}
                    </button>
                  );
                })}
              </div>
              {g.feedback && (
                <div style={{ padding:'10px 14px', borderRadius:10, background:'#F3E5F5', fontSize:12, color:'#6B6B6B', textAlign:'center' }}>
                  {q.reason}<br/>
                  <span style={{ fontWeight:700, color:'#7B1FA2' }}>他の3つは「{q.category}」です</span>
                </div>
              )}
            </div>
          )}

          {/* COMMON LINK MODE */}
          {q.mode === 'common' && (
            <div>
              <div style={{ fontSize:14, fontWeight:700, color:'#6B6B6B', marginBottom:14, textAlign:'center' }}>
                3つの言葉の共通点は何？
              </div>
              <div style={{ display:'flex', justifyContent:'center', gap:10, marginBottom:20, flexWrap:'wrap' }}>
                {q.words.map((w, i) => (
                  <div key={i} style={{
                    padding:'12px 20px', borderRadius:14,
                    background:'#E8F5E9', border:'2px solid #C8E6C9',
                    fontSize:16, fontWeight:700, color:'#2E7D32',
                  }}>
                    {w}
                  </div>
                ))}
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {q.opts.map((opt, i) => {
                  const isSelected = g.selected === opt;
                  const isCorrect = opt === q.answer;
                  const answered = g.selected !== null;
                  return (
                    <button key={i} onClick={() => handleAnswer(opt)} disabled={answered}
                      style={{
                        ...btnBase, fontSize:14, fontWeight:700, padding:'14px 16px', borderRadius:14,
                        border: `3px solid ${answered && isCorrect ? '#66BB6A' : answered && isSelected && !isCorrect ? '#EF5350' : '#E8E8E8'}`,
                        background: answered && isCorrect ? '#E8F5E9' : answered && isSelected && !isCorrect ? '#FFEBEE' : 'white',
                        color: answered && isCorrect ? '#2E7D32' : answered && isSelected && !isCorrect ? '#C62828' : '#2D2D2D',
                        opacity: answered && !isCorrect && !isSelected ? 0.5 : 1,
                        textAlign:'left', display:'flex', alignItems:'center', gap:10,
                      }}>
                      <div style={{
                        width:28, height:28, borderRadius:'50%', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:12, fontWeight:700, fontFamily:'Outfit',
                        background: answered && isCorrect ? '#66BB6A' : answered && isSelected && !isCorrect ? '#EF5350' : '#F5F5F5',
                        color: answered && (isCorrect || isSelected) ? 'white' : '#9E9E9E',
                      }}>
                        {answered && isCorrect ? '✓' : answered && isSelected && !isCorrect ? '✗' : String.fromCharCode(65+i)}
                      </div>
                      {opt}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* Feedback */}
        {g.feedback && (
          <div style={{
            textAlign:'center', fontSize:16, fontWeight:900,
            color: g.feedback === 'correct' ? '#2E7D32' : '#C62828',
            animation:'fadeUp 0.3s ease-out', padding:8,
          }}>
            {g.feedback === 'correct' ? '✅ 正解！' : '❌ おしい！'}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF7', minHeight:'100vh', color:'#2D2D2D' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px', borderRadius:8}}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#FF6B35' }}>🔤 言葉つなぎ</span>
        </div>
        {screen === 'game' && (
          <div style={{ display:'flex', gap:6 }}>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#2EC4B6', padding:'3px 10px', borderRadius:50 }}>{g.currentQ+1}/{g.questions.length}</span>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#FF6B35', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
          </div>
        )}
      </div>

      {/* ===== SELECT ===== */}
      {screen === 'select' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16, animation:'bounce 2s infinite' }}>🔤</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:6 }}>言葉つなぎ</div>
          <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:8, lineHeight:1.7 }}>
            ヒントや仲間から<br/>正しい言葉を見つけよう！
          </div>
          <div style={{ fontSize:12, color:'#9E9E9E', marginBottom:28, background:'#FFF3E0', padding:'8px 16px', borderRadius:12 }}>
            🧠 意味記憶・語彙力・分類能力のトレーニングです
          </div>

          {/* 3 modes explanation */}
          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'18px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)' }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:12, textAlign:'left' }}>📝 3つのモードがミックスで出題されます</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {MODE_INFO.map(m => (
                <div key={m.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 14px', background:m.id==='hint'?'#FFF3E0':m.id==='odd'?'#F3E5F5':'#E8F5E9', borderRadius:12 }}>
                  <span style={{ fontSize:22 }}>{m.icon}</span>
                  <div style={{ textAlign:'left' }}>
                    <span style={{ fontSize:13, fontWeight:700, color:m.color }}>{m.label}</span>
                    <div style={{ fontSize:11, color:'#6B6B6B' }}>{m.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420 }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度を選んでスタート</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {Object.entries(DIFF).map(([k,d]) => (
                <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'3px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left'}}>
                  <span style={{ fontSize:26 }}>{d.emoji}</span>
                  <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
                </button>
              ))}
            </div>
          </div>

          {/* History */}
          {history.length > 0 && (
            <div style={{ width:'100%', maxWidth:420, marginTop:28, textAlign:'left' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
              {history.slice(0,5).map((h,i) => {
                const hc = DIFF[h.diff]; const d = new Date(h.date);
                return (
                  <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                      <div>
                        <div style={{fontSize:12,fontWeight:700}}>{hc.label}・{h.correct}/{h.total}正解</div>
                        <div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div>
                      </div>
                    </div>
                    <div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#FF6B35'}}>{h.score}pt</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ===== GAME ===== */}
      {screen === 'game' && g.phase === 'playing' && (
        <div style={{ padding:'0 16px', maxWidth:500, margin:'0 auto' }}>
          {/* Status */}
          <div style={{ display:'flex', justifyContent:'center', gap:20, padding:'12px 16px', background:'white', borderBottom:'1px solid #F0F0F0', borderRadius:'0 0 16px 16px', marginBottom:8 }}>
            {[
              { v:g.score, l:'スコア', c:'#FF6B35' },
              { v:g.correct+'/'+(g.currentQ+(g.selected?1:0)), l:'正解数', c:'#2EC4B6' },
              { v:(g.currentQ+1)+'/'+g.questions.length, l:'問題', c:'#7B1FA2' },
            ].map((s,i) => (
              <div key={i} style={{ textAlign:'center' }}>
                <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:s.c }}>{s.v}</div>
                <div style={{ fontSize:9, color:'#9E9E9E', marginTop:2 }}>{s.l}</div>
              </div>
            ))}
          </div>

          {/* Progress */}
          <div style={{ display:'flex', gap:3, marginBottom:12 }}>
            {g.questions.map((_, i) => (
              <div key={i} style={{
                flex:1, height:5, borderRadius:3,
                background: i < g.results.length
                  ? (g.results[i].correct ? '#66BB6A' : '#EF5350')
                  : i === g.currentQ ? '#FFB74D' : '#E8E8E8',
              }} />
            ))}
          </div>

          {renderQuestion()}
          <div style={{ height:24 }} />
        </div>
      )}

      {/* ===== RESULT ===== */}
      {screen === 'result' && (() => {
        const pct = g.questions.length > 0 ? g.correct / g.questions.length : 0;
        const stars = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.55 ? '⭐⭐' : '⭐';
        const msg = pct >= 0.85 ? 'すばらしい語彙力！' : pct >= 0.55 ? 'よくできました！' : 'もう一度挑戦！';

        // Per-mode stats
        const modeStats = ['hint','odd','common'].map(m => {
          const qs = g.results.filter(r => r.q.mode === m);
          return { mode:m, total:qs.length, correct:qs.filter(r => r.correct).length };
        }).filter(s => s.total > 0);

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'30px 20px', textAlign:'center' }}>
            <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:4, animation:'fadeUp 0.6s ease-out 0.1s both' }}>{msg}</div>
            <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:24, animation:'fadeUp 0.6s ease-out 0.2s both' }}>{cfg.label}モード</div>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:24, animation:'fadeUp 0.6s ease-out 0.3s both' }}>
              {[{v:`${g.correct}/${g.questions.length}`,l:'正解数'},{v:Math.round(pct*100)+'%',l:'正答率'},{v:g.score,l:'スコア'}].map((s,i) =>
                <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:24, fontWeight:800, color:'#FF6B35' }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
                </div>
              )}
            </div>

            {/* Mode breakdown */}
            <div style={{ width:'100%', maxWidth:400, marginBottom:24, animation:'fadeUp 0.6s ease-out 0.35s both' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 モード別成績</div>
              <div style={{ display:'flex', gap:8 }}>
                {modeStats.map((s, i) => {
                  const info = MODE_INFO.find(m => m.id === s.mode);
                  return (
                    <div key={i} style={{ flex:1, background:'white', borderRadius:14, padding:'12px 8px', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', textAlign:'center' }}>
                      <div style={{ fontSize:20, marginBottom:4 }}>{info?.icon}</div>
                      <div style={{ fontSize:11, fontWeight:700, color:info?.color }}>{info?.label}</div>
                      <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:'#2D2D2D', marginTop:4 }}>{s.correct}/{s.total}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Review */}
            <div style={{ width:'100%', maxWidth:400, marginBottom:28, animation:'fadeUp 0.6s ease-out 0.4s both' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📋 回答の振り返り</div>
              {g.results.map((r, i) => {
                const mInfo = MODE_INFO.find(m => m.id === r.q.mode);
                return (
                  <div key={i} style={{
                    background: r.correct ? '#F1F8E9' : '#FFF3E0',
                    borderRadius:12, padding:'10px 14px', marginBottom:6,
                    borderLeft: `4px solid ${r.correct ? '#66BB6A' : '#FF6B35'}`,
                    textAlign:'left', fontSize:12,
                  }}>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:4 }}>
                      <span>{r.correct ? '✅' : '❌'}</span>
                      <span style={{ fontSize:10, fontWeight:700, color:mInfo?.color }}>{mInfo?.icon} {mInfo?.label}</span>
                    </div>
                    <div style={{ fontWeight:700, color:'#2D2D2D' }}>
                      {r.q.mode === 'hint' && `ヒント: ${r.q.hints.join('、')} → 正解: ${r.q.answer}`}
                      {r.q.mode === 'odd' && `${r.q.items.join('、')} → 仲間はずれ: ${r.q.odd}`}
                      {r.q.mode === 'common' && `${r.q.words.join('、')} → 共通点: ${r.q.answer}`}
                    </div>
                  </div>
                );
              })}
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300, animation:'fadeUp 0.6s ease-out 0.45s both' }}>
              <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60}}>もう一度プレイ 🔄</button>
              <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60}}>設定を変える</button>
            </div>
          </div>
        );
      })()}

      {ConfettiEl}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
