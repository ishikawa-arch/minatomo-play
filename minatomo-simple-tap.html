<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>タップ！タップ！ | みなともPlay</title>
<meta name="description" content="タップ！タップ！ - 無料リハビリゲーム みなともPlay">
<meta name="minatomo-domain" content="attention">
<meta name="minatomo-category" content="シンプル">
<meta name="minatomo-source" content="jsx-build-20260425T100701">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
<meta name="minatomo-id" content="minatomo-simple-tap">
<meta name="minatomo-domain-primary" content="attention">
<meta name="minatomo-domain-subdomains" content="reaction_time,motor_control">
<meta name="minatomo-target" content="moderate_dementia,mild_dementia,stroke_chronic">
<meta name="minatomo-difficulty-levels" content="1,2,3">
<meta name="minatomo-duration" content="3">
<meta name="minatomo-completion-status" content="auto_filled">
<meta name="minatomo-applied-patterns" content="P1">
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">

// ========== 【シンプル】タップ！タップ！ ==========
const EMOJIS = ['🐱','🐶','🐸','🐰','🐟','🌸','⭐','🍎','🎈','❤️','🌻','🍰','🚗','☀️','🐧'];

function App() {
  const [screen, setScreen] = React.useState('start');
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    score: 0, hits: 0, misses: 0, total: 15,
    current: null, // { emoji, x, y }
    phase: 'idle', // idle, showing, tapped, missed
    round: 0,
  }).current;

  const timerRef = React.useRef(null);
  const missRef = React.useRef(null);
  React.useEffect(() => () => { clearTimeout(timerRef.current); clearTimeout(missRef.current); }, []);

  const startGame = () => {
    g.score = 0; g.hits = 0; g.misses = 0; g.round = 0;
    g.current = null; g.phase = 'idle';
    setScreen('play');
    rerender();
    timerRef.current = setTimeout(showNext, 800);
  };

  const showNext = () => {
    if (g.round >= g.total) {
      setScreen('done');
      rerender();
      return;
    }

    const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    // Random position (keep away from edges)
    const x = 15 + Math.random() * 70; // 15% ~ 85%
    const y = 10 + Math.random() * 65; // 10% ~ 75%

    g.current = { emoji, x, y };
    g.phase = 'showing';
    g.round++;
    rerender();

    // Auto-miss: gets faster over time
    const displayTime = Math.max(1000, 2200 - g.round * 80);
    missRef.current = setTimeout(() => {
      if (g.phase === 'showing') {
        g.phase = 'missed';
        g.misses++;
        rerender();
        timerRef.current = setTimeout(() => {
          g.current = null;
          g.phase = 'idle';
          rerender();
          timerRef.current = setTimeout(showNext, 400);
        }, 600);
      }
    }, displayTime);
  };

  const handleTap = () => {
    if (g.phase !== 'showing') return;
    clearTimeout(missRef.current);
    g.phase = 'tapped';
    g.hits++;
    g.score += 10;
    rerender();

    timerRef.current = setTimeout(() => {
      g.current = null;
      g.phase = 'idle';
      rerender();
      timerRef.current = setTimeout(showNext, 300);
    }, 400);
  };

  const bs = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.15s' };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF8', minHeight:'100vh', color:'#333' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
        @keyframes shrink{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
        @keyframes bigPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        @keyframes float{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
        @media(min-width:768px){#root{zoom:1.25}}@media(min-width:1200px){#root{zoom:1.8}}@media(min-width:1920px){#root{zoom:2.4}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'10px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 1px 4px rgba(0,0,0,0.03)' }}>
        <span style={{ fontSize:18, fontWeight:900, color:'#E8652E', letterSpacing:'0.08em' }}>👆 タップ！タップ！</span>
        {screen === 'play' && (
          <span style={{ fontSize:14, fontWeight:800, color:'white', background:'#888', padding:'4px 12px', borderRadius:50 }}>{g.round} / {g.total}</span>
        )}
      </div>

      {/* ===== START ===== */}
      {screen === 'start' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
          <div style={{ fontSize:80, marginBottom:20, animation:'float 2.5s ease-in-out infinite', willChange:'transform' }}>🐱</div>

          <div style={{ fontSize:26, fontWeight:900, color:'#333', marginBottom:8, letterSpacing:'0.06em', lineHeight:1.6 }}>
            でてきたらタップ！
          </div>
          <div style={{ fontSize:16, color:'#9E9E9E', marginBottom:40 }}>
            すばやくタッチしよう
          </div>

          <button onClick={startGame} style={{
            ...bs, fontSize:28, fontWeight:900, color:'white',
            background:'#E8652E', border:'none',
            padding:'24px 64px', borderRadius:60,
            letterSpacing:'0.1em',
            boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
          }}>
            はじめる
          </button>
        </div>
      )}

      {/* ===== PLAY ===== */}
      {screen === 'play' && (
        <div style={{ padding:'12px 16px', maxWidth:580, margin:'0 auto' }}>

          {/* Progress dots */}
          <div style={{ display:'flex', gap:3, justifyContent:'center', marginBottom:10 }}>
            {Array.from({ length: g.total }).map((_, i) => (
              <div key={i} style={{
                width: 8, height: 8, borderRadius: 4,
                background: i < g.round - (g.phase !== 'idle' ? 1 : 0)
                  ? '#8BC34A' : i === g.round - 1 && g.phase !== 'idle' ? '#E8652E' : '#E0E0E0',
              }} />
            ))}
          </div>

          {/* Score */}
          <div style={{ textAlign:'center', marginBottom:8 }}>
            <span style={{ fontFamily:'Outfit,sans-serif', fontSize:28, fontWeight:900, color:'#E8652E' }}>{g.score}</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#9E9E9E', marginLeft:4 }}>てん</span>
          </div>

          {/* Game area */}
          <div style={{
            position:'relative', width:'100%', height:380,
            background:'white', borderRadius:24,
            border:'2px solid #E8E8E8',
            overflow:'hidden',
            userSelect:'none', WebkitUserSelect:'none',
          }}>

            {/* Target emoji */}
            {g.current && (
              <div style={{
                position:'absolute',
                left: g.current.x + '%',
                top: g.current.y + '%',
                transform: 'translate(-50%,-50%)',
                userSelect:'none', WebkitUserSelect:'none',
              }}>
                <div
                  onMouseDown={handleTap}
                  onTouchStart={(e) => { e.preventDefault(); handleTap(); }}
                  style={{
                    width: 64, height: 64,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    cursor: 'pointer',
                    animation: g.phase === 'showing' ? 'pop 0.25s ease-out'
                      : g.phase === 'tapped' ? 'shrink 0.3s ease-in forwards'
                      : g.phase === 'missed' ? 'shrink 0.5s ease-in forwards'
                      : undefined,
                    filter: g.phase === 'missed' ? 'grayscale(1)' : 'none',
                    userSelect:'none', WebkitUserSelect:'none',
                  }}>
                  <span style={{ fontSize:56, lineHeight:1, pointerEvents:'none' }}>{g.current.emoji}</span>
                </div>
              </div>
            )}

            {/* Tapped feedback */}
            {g.phase === 'tapped' && g.current && (
              <div style={{
                position:'absolute',
                left: g.current.x + '%', top: g.current.y + '%',
                transform: 'translate(-50%,-50%)',
                pointerEvents:'none',
              }}>
                <div style={{ fontSize:40, animation:'fadeUp 0.3s ease-out' }}>⭕</div>
              </div>
            )}

            {/* Missed feedback */}
            {g.phase === 'missed' && (
              <div style={{
                position:'absolute', inset:0,
                display:'flex', alignItems:'center', justifyContent:'center',
                pointerEvents:'none',
              }}>
                <span style={{ fontSize:24, fontWeight:900, color:'#C62828', animation:'fadeUp 0.3s ease-out' }}>おしい！</span>
              </div>
            )}

            {/* Waiting state */}
            {g.phase === 'idle' && !g.current && (
              <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                <span style={{ fontSize:20, color:'#E0E0E0', fontWeight:700 }}>・・・</span>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ===== DONE ===== */}
      {screen === 'done' && (() => {
        const pct = g.hits / g.total;
        const emoji = pct >= 0.8 ? '🎉' : pct >= 0.5 ? '👍' : '😊';
        const msg = pct >= 0.8 ? 'すごい！' : pct >= 0.5 ? 'いいね！' : 'またやろう！';

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
            <div style={{ fontSize:80, marginBottom:16, animation:'pop 0.6s ease-out' }}>{emoji}</div>
            <div style={{ fontSize:32, fontWeight:900, color:'#E8652E', marginBottom:12, letterSpacing:'0.08em' }}>{msg}</div>

            <div style={{ background:'white', borderRadius:24, padding:'20px 40px', boxShadow:'0 4px 16px rgba(0,0,0,0.06)', marginBottom:12 }}>
              <div style={{ fontFamily:'Outfit,sans-serif', fontSize:48, fontWeight:900, color:'#E8652E' }}>
                {g.score}<span style={{ fontSize:20, color:'#9E9E9E' }}>てん</span>
              </div>
            </div>

            <div style={{ fontSize:20, fontWeight:700, color:'#6B6B6B', marginBottom:40 }}>
              {g.hits}かい タッチ！ / {g.total}かい
            </div>

            <button onClick={startGame} style={{
              ...bs, fontSize:24, fontWeight:900, color:'white',
              background:'#E8652E', border:'none',
              padding:'22px 48px', borderRadius:60,
              letterSpacing:'0.08em',
              boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
            }}>
              もういちど
            </button>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
