<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>いろあわせ | みなともPlay</title>
<meta name="description" content="いろあわせ - 無料リハビリゲーム みなともPlay">
<meta name="minatomo-domain" content="attention">
<meta name="minatomo-category" content="シンプル">
<meta name="minatomo-source" content="jsx-build-20260425T100701">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">

// ========== 【シンプル】いろあわせ ==========
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

const COLORS = [
  { name:'あか',   bg:'#E53935' },
  { name:'あお',   bg:'#1E88E5' },
  { name:'きいろ', bg:'#FDD835' },
  { name:'みどり', bg:'#43A047' },
  { name:'オレンジ', bg:'#FB8C00' },
  { name:'むらさき', bg:'#8E24AA' },
];

// Generate rounds: gradually increase choices (3→4→5→6)
function genRounds(count) {
  const rounds = [];
  for (let i = 0; i < count; i++) {
    // Gradually increase: first 4 = 3 choices, next 4 = 4, etc.
    const numChoices = Math.min(6, 3 + Math.floor(i / 4));
    const pool = shuffle([...COLORS]).slice(0, numChoices);
    const target = pool[Math.floor(Math.random() * pool.length)];
    rounds.push({ target, choices: shuffle(pool) });
  }
  return rounds;
}

function App() {
  const [screen, setScreen] = React.useState('start');
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    rounds: [], currentR: 0, score: 0, correct: 0,
    feedback: null, selected: null,
  }).current;

  const timerRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(timerRef.current), []);

  const startGame = () => {
    g.rounds = genRounds(12);
    g.currentR = 0; g.score = 0; g.correct = 0;
    g.feedback = null; g.selected = null;
    setScreen('play');
    rerender();
  };

  const handleTap = (color) => {
    if (g.feedback) return;
    const round = g.rounds[g.currentR];
    const isCorrect = color.name === round.target.name;
    g.selected = color.name;
    g.feedback = isCorrect ? 'correct' : 'wrong';
    if (isCorrect) { g.correct++; g.score += 10; }
    rerender();

    timerRef.current = setTimeout(() => {
      g.selected = null; g.feedback = null;
      g.currentR++;
      if (g.currentR >= g.rounds.length) {
        setScreen('done');
      }
      rerender();
    }, isCorrect ? 800 : 1500);
  };

  const round = g.currentR < g.rounds.length ? g.rounds[g.currentR] : null;
  const bs = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.15s' };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF8', minHeight:'100vh', color:'#333' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop{0%{transform:scale(0.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        @keyframes bigPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        @media(min-width:768px){#root{zoom:1.25}}@media(min-width:1200px){#root{zoom:1.8}}@media(min-width:1920px){#root{zoom:2.4}}
      `}</style>

      {/* TOP BAR - minimal */}
      <div style={{ background:'white', padding:'10px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 1px 4px rgba(0,0,0,0.03)' }}>
        <span style={{ fontSize:18, fontWeight:900, color:'#E8652E', letterSpacing:'0.08em' }}>🎨 いろあわせ</span>
        {screen === 'play' && (
          <span style={{ fontSize:14, fontWeight:800, color:'white', background:'#888', padding:'4px 12px', borderRadius:50 }}>{g.currentR + 1} / {g.rounds.length}</span>
        )}
      </div>

      {/* ===== START ===== */}
      {screen === 'start' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
          {/* Visual demo: big colored circle */}
          <div style={{
            width:120, height:120, borderRadius:'50%', background:'#E53935',
            marginBottom:24, animation:'bigPulse 2s ease-in-out infinite',
            boxShadow:'0 8px 24px rgba(229,57,53,0.3)',
          }} />

          {/* One-line instruction */}
          <div style={{ fontSize:26, fontWeight:900, color:'#333', marginBottom:8, letterSpacing:'0.06em', lineHeight:1.6 }}>
            おなじ色をタップ！
          </div>
          <div style={{ fontSize:16, color:'#9E9E9E', marginBottom:40 }}>
            上の色とおなじものをえらぼう
          </div>

          {/* BIG start button */}
          <button onClick={startGame} style={{
            ...bs, fontSize:28, fontWeight:900, color:'white',
            background:'#E8652E', border:'none',
            padding:'24px 64px', borderRadius:60,
            letterSpacing:'0.1em',
            boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
          }}>
            はじめる
          </button>
        </div>
      )}

      {/* ===== PLAY ===== */}
      {screen === 'play' && round && (
        <div style={{ padding:'16px', maxWidth:580, margin:'0 auto', animation:'fadeUp 0.3s ease-out' }} key={g.currentR}>

          {/* Progress dots */}
          <div style={{ display:'flex', gap:3, justifyContent:'center', marginBottom:16 }}>
            {g.rounds.map((_, i) => (
              <div key={i} style={{
                width:i === g.currentR ? 12 : 8, height:8, borderRadius:4,
                background: i < g.currentR
                  ? (g.correct > i - (g.rounds.length - g.correct - (g.rounds.length - g.currentR)) ? '#8BC34A' : '#EF9A9A')
                  : i === g.currentR ? '#E8652E' : '#E0E0E0',
                transition:'all 0.3s',
              }} />
            ))}
          </div>

          {/* Score - simple */}
          <div style={{ textAlign:'center', marginBottom:16 }}>
            <span style={{ fontFamily:'Outfit,sans-serif', fontSize:24, fontWeight:900, color:'#E8652E' }}>{g.score}</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#9E9E9E', marginLeft:4 }}>てん</span>
          </div>

          {/* Target color - BIG */}
          <div style={{ textAlign:'center', marginBottom:8 }}>
            <div style={{ fontSize:16, fontWeight:700, color:'#9E9E9E', marginBottom:8 }}>この色とおなじものは？</div>
            <div style={{
              width:140, height:140, borderRadius:24, background:round.target.bg,
              margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'center',
              boxShadow:`0 8px 24px ${round.target.bg}44`,
              animation: g.feedback ? undefined : 'pop 0.3s ease-out',
            }}>
              <span style={{ fontSize:20, fontWeight:900, color:'white', textShadow:'0 2px 4px rgba(0,0,0,0.2)' }}>
                {round.target.name}
              </span>
            </div>
          </div>

          {/* Feedback overlay */}
          {g.feedback && (
            <div style={{ textAlign:'center', marginBottom:8, animation:'fadeUp 0.2s ease-out' }}>
              <span style={{ fontSize:48 }}>{g.feedback === 'correct' ? '⭕' : '❌'}</span>
            </div>
          )}

          {!g.feedback && <div style={{ height:56 }} />}

          {/* Choice buttons - BIG and colorful */}
          <div style={{
            display:'grid',
            gridTemplateColumns: round.choices.length <= 4 ? 'repeat(2,1fr)' : 'repeat(3,1fr)',
            gap:12,
          }}>
            {round.choices.map((c, i) => {
              const isSelected = g.selected === c.name;
              const isCorrectAnswer = c.name === round.target.name;
              const showCorrect = g.feedback && isCorrectAnswer;
              const showWrong = g.feedback === 'wrong' && isSelected;

              return (
                <button key={i} onClick={() => handleTap(c)}
                  style={{
                    ...bs,
                    height: round.choices.length <= 4 ? 100 : 80,
                    borderRadius:18,
                    background: c.bg,
                    border: `4px solid ${showCorrect ? 'white' : showWrong ? '#333' : 'transparent'}`,
                    opacity: g.feedback && !showCorrect && !showWrong ? 0.3 : 1,
                    animation: showWrong ? 'shake 0.3s' : showCorrect ? 'pop 0.3s' : undefined,
                    boxShadow: `0 4px 12px ${c.bg}44`,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    pointerEvents: g.feedback ? 'none' : 'auto',
                  }}>
                  <span style={{
                    fontSize: round.choices.length <= 4 ? 20 : 16,
                    fontWeight:900, color:'white',
                    textShadow:'0 2px 4px rgba(0,0,0,0.2)',
                  }}>
                    {c.name}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* ===== DONE ===== */}
      {screen === 'done' && (() => {
        const total = g.rounds.length;
        const pct = g.correct / total;
        const emoji = pct >= 0.8 ? '🎉' : pct >= 0.5 ? '👍' : '😊';
        const msg = pct >= 0.8 ? 'すごい！' : pct >= 0.5 ? 'いいね！' : 'またやろう！';

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
            <div style={{ fontSize:80, marginBottom:16, animation:'pop 0.6s ease-out' }}>{emoji}</div>
            <div style={{ fontSize:32, fontWeight:900, color:'#E8652E', marginBottom:12, letterSpacing:'0.08em' }}>{msg}</div>

            {/* Score - big and simple */}
            <div style={{ background:'white', borderRadius:24, padding:'20px 40px', boxShadow:'0 4px 16px rgba(0,0,0,0.06)', marginBottom:12 }}>
              <div style={{ fontFamily:'Outfit,sans-serif', fontSize:48, fontWeight:900, color:'#E8652E' }}>
                {g.score}<span style={{ fontSize:20, color:'#9E9E9E' }}>てん</span>
              </div>
            </div>

            <div style={{ fontSize:20, fontWeight:700, color:'#6B6B6B', marginBottom:40 }}>
              {g.correct}もん せいかい / {total}もん
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:12, width:'100%', maxWidth:300 }}>
              <button onClick={startGame} style={{
                ...bs, fontSize:24, fontWeight:900, color:'white',
                background:'#E8652E', border:'none',
                padding:'22px 48px', borderRadius:60,
                letterSpacing:'0.08em',
                boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
              }}>
                もういちど
              </button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
