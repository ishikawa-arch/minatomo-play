<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>いちばんおおい！ | みなともPlay</title>
<meta name="description" content="いちばんおおい！ - 無料リハビリゲーム みなともPlay">
<meta name="minatomo-domain" content="visuospatial">
<meta name="minatomo-category" content="シンプル">
<meta name="minatomo-source" content="jsx-build-20260425T100701">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #FAFAF7; }
  #root { min-height: 100vh; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #6B6B6B; }
</style>
<meta name="minatomo-id" content="minatomo-simple-mostcommon">
<meta name="minatomo-domain-primary" content="visuospatial">
<meta name="minatomo-domain-subdomains" content="selective_attention">

</head>
<body>
<div id="root"><div class="loading">読み込み中...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel" data-type="module">

// ========== 【シンプル】いちばんおおい！ ==========
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

const ALL_EMOJIS = ['🍎','🐱','⭐','🌸','🚗','🎈','🐟','🍰','❤️','🐸','🌻','🎵','🍊','🐧'];

function genRounds(count) {
  const rounds = [];
  for (let i = 0; i < count; i++) {
    let numTypes, totalItems;
    if (i < 4) { numTypes = 2; totalItems = 6 + Math.floor(Math.random() * 3); }
    else if (i < 8) { numTypes = 3; totalItems = 9 + Math.floor(Math.random() * 4); }
    else { numTypes = 3; totalItems = 12 + Math.floor(Math.random() * 4); }

    const pool = shuffle([...ALL_EMOJIS]).slice(0, numTypes);

    // Distribute items - one type must be clearly the most
    const counts = new Array(numTypes).fill(0);
    const winnerIdx = Math.floor(Math.random() * numTypes);

    // Give winner at least 2 more than others
    let remaining = totalItems;
    for (let j = 0; j < numTypes; j++) {
      if (j === winnerIdx) continue;
      const c = Math.floor(remaining / (numTypes + 1)) + Math.floor(Math.random() * 2);
      counts[j] = Math.max(1, c);
      remaining -= counts[j];
    }
    counts[winnerIdx] = remaining;

    // Ensure winner is actually the most
    const maxOther = Math.max(...counts.filter((_, j) => j !== winnerIdx));
    if (counts[winnerIdx] <= maxOther) counts[winnerIdx] = maxOther + 2;

    // Build scattered items
    const items = [];
    // Seeded random for positions
    let seed = i * 1000 + 7;
    for (let j = 0; j < numTypes; j++) {
      for (let k = 0; k < counts[j]; k++) {
        seed = (seed * 9301 + 49297) % 233280;
        const x = 5 + (seed / 233280) * 82;
        seed = (seed * 9301 + 49297) % 233280;
        const y = 4 + (seed / 233280) * 80;
        items.push({ emoji: pool[j], x, y });
      }
    }

    const choices = pool.map((emoji, j) => ({ emoji, count: counts[j] }));

    rounds.push({
      items: shuffle(items),
      choices: shuffle(choices),
      winner: pool[winnerIdx],
      winnerCount: counts[winnerIdx],
    });
  }
  return rounds;
}

function App() {
  const [screen, setScreen] = React.useState('start');
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    rounds:[], currentR:0, score:0, correct:0,
    feedback:null, selected:null,
  }).current;

  const timerRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(timerRef.current), []);

  const startGame = () => {
    g.rounds = genRounds(12);
    g.currentR = 0; g.score = 0; g.correct = 0;
    g.feedback = null; g.selected = null;
    setScreen('play'); rerender();
  };

  const handleTap = (emoji) => {
    if (g.feedback) return;
    const round = g.rounds[g.currentR];
    const isCorrect = emoji === round.winner;
    g.selected = emoji;
    g.feedback = isCorrect ? 'correct' : 'wrong';
    if (isCorrect) { g.correct++; g.score += 10; }
    rerender();

    timerRef.current = setTimeout(() => {
      g.selected = null; g.feedback = null;
      g.currentR++;
      if (g.currentR >= g.rounds.length) setScreen('done');
      rerender();
    }, isCorrect ? 800 : 1500);
  };

  const round = g.currentR < g.rounds.length ? g.rounds[g.currentR] : null;
  const bs = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.15s' };

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF8', minHeight:'100vh', color:'#333' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop{0%{transform:scale(0.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        @media(min-width:768px){#root{zoom:1.25}}@media(min-width:1200px){#root{zoom:1.8}}@media(min-width:1920px){#root{zoom:2.4}}
      `}</style>

      <div style={{ background:'white', padding:'10px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 1px 4px rgba(0,0,0,0.03)' }}>
        <span style={{ fontSize:18, fontWeight:900, color:'#E8652E', letterSpacing:'0.08em' }}>🏆 いちばんおおい！</span>
        {screen === 'play' && (
          <span style={{ fontSize:14, fontWeight:800, color:'white', background:'#888', padding:'4px 12px', borderRadius:50 }}>{g.currentR + 1} / {g.rounds.length}</span>
        )}
      </div>

      {/* START */}
      {screen === 'start' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
          <div style={{ position:'relative', width:180, height:100, marginBottom:16 }}>
            {[
              {e:'🍎',x:10,y:5},{e:'🍎',x:55,y:10},{e:'🍎',x:30,y:55},{e:'🍎',x:75,y:50},
              {e:'⭐',x:5,y:40},{e:'⭐',x:60,y:70},
              {e:'🐱',x:40,y:25},
            ].map((item, i) => (
              <span key={i} style={{ position:'absolute', left:item.x+'%', top:item.y+'%', fontSize:28 }}>{item.e}</span>
            ))}
          </div>
          <div style={{ fontSize:16, fontWeight:900, color:'#E8652E', marginBottom:20 }}>🍎が4こでいちばん！</div>

          <div style={{ fontSize:26, fontWeight:900, color:'#333', marginBottom:8, letterSpacing:'0.06em' }}>
            いちばんおおいのは？
          </div>
          <div style={{ fontSize:16, color:'#9E9E9E', marginBottom:40 }}>
            かぞえてえらぼう！
          </div>

          <button onClick={startGame} style={{
            ...bs, fontSize:28, fontWeight:900, color:'white',
            background:'#E8652E', border:'none',
            padding:'24px 64px', borderRadius:60,
            boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
          }}>はじめる</button>
        </div>
      )}

      {/* PLAY */}
      {screen === 'play' && round && (
        <div style={{ padding:'16px', maxWidth:580, margin:'0 auto', animation:'fadeUp 0.3s ease-out' }} key={g.currentR}>

          <div style={{ display:'flex', gap:3, justifyContent:'center', marginBottom:10 }}>
            {g.rounds.map((_, i) => (
              <div key={i} style={{
                width: i === g.currentR ? 12 : 8, height:8, borderRadius:4,
                background: i < g.currentR ? '#8BC34A' : i === g.currentR ? '#E8652E' : '#E0E0E0',
              }} />
            ))}
          </div>

          <div style={{ textAlign:'center', marginBottom:10 }}>
            <span style={{ fontFamily:'Outfit,sans-serif', fontSize:24, fontWeight:900, color:'#E8652E' }}>{g.score}</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#9E9E9E', marginLeft:4 }}>てん</span>
          </div>

          <div style={{ fontSize:18, fontWeight:900, color:'#9E9E9E', textAlign:'center', marginBottom:8 }}>
            いちばんおおいのは？
          </div>

          {/* Scatter area */}
          <div style={{
            position:'relative', width:'100%', height:200,
            background:'white', borderRadius:20,
            border:'2px solid #E8E8E8',
            marginBottom:12, overflow:'hidden',
          }}>
            {round.items.map((item, i) => (
              <span key={i} style={{
                position:'absolute',
                left:item.x+'%', top:item.y+'%',
                fontSize:26, lineHeight:1,
                pointerEvents:'none', userSelect:'none',
              }}>{item.emoji}</span>
            ))}
          </div>

          {/* Feedback */}
          {g.feedback && (
            <div style={{ textAlign:'center', marginBottom:8, animation:'fadeUp 0.2s ease-out' }}>
              <span style={{ fontSize:48 }}>{g.feedback === 'correct' ? '⭕' : '❌'}</span>
              <div style={{ fontSize:14, fontWeight:700, color:'#555', marginTop:2 }}>
                {round.choices.map(c => `${c.emoji}${c.count}こ`).join('　')}
              </div>
            </div>
          )}
          {!g.feedback && <div style={{ height:64 }} />}

          {/* Choice buttons */}
          <div style={{ display:'flex', gap:12, justifyContent:'center' }}>
            {round.choices.map((choice, i) => {
              const isSelected = g.selected === choice.emoji;
              const isCorrect = choice.emoji === round.winner;
              const showCorrect = g.feedback && isCorrect;
              const showWrong = g.feedback === 'wrong' && isSelected;

              return (
                <button key={i} onClick={() => handleTap(choice.emoji)}
                  style={{
                    ...bs,
                    flex:1, maxWidth:100, height:90, borderRadius:20,
                    background: showCorrect ? '#F1F8E9' : showWrong ? '#FFF5F5' : 'white',
                    border: `4px solid ${showCorrect ? '#66BB6A' : showWrong ? '#EF5350' : '#E8E8E8'}`,
                    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2,
                    animation: showWrong ? 'shake 0.3s' : showCorrect ? 'pop 0.3s' : undefined,
                    opacity: g.feedback && !showCorrect && !showWrong ? 0.3 : 1,
                    boxShadow: '0 3px 10px rgba(0,0,0,0.06)',
                    pointerEvents: g.feedback ? 'none' : 'auto',
                  }}>
                  <span style={{ fontSize:40, lineHeight:1 }}>{choice.emoji}</span>
                  {g.feedback && (
                    <span style={{ fontFamily:'Outfit', fontSize:14, fontWeight:900, color: isCorrect ? '#2E7D32' : '#999' }}>{choice.count}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* DONE */}
      {screen === 'done' && (() => {
        const total = g.rounds.length;
        const pct = g.correct / total;
        const emoji = pct >= 0.8 ? '🎉' : pct >= 0.5 ? '👍' : '😊';
        const msg = pct >= 0.8 ? 'すごい！' : pct >= 0.5 ? 'いいね！' : 'またやろう！';
        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 20px', textAlign:'center', minHeight:'70vh' }}>
            <div style={{ fontSize:80, marginBottom:16, animation:'pop 0.6s ease-out' }}>{emoji}</div>
            <div style={{ fontSize:32, fontWeight:900, color:'#E8652E', marginBottom:12 }}>{msg}</div>
            <div style={{ background:'white', borderRadius:24, padding:'20px 40px', boxShadow:'0 4px 16px rgba(0,0,0,0.06)', marginBottom:12 }}>
              <div style={{ fontFamily:'Outfit,sans-serif', fontSize:48, fontWeight:900, color:'#E8652E' }}>
                {g.score}<span style={{ fontSize:20, color:'#9E9E9E' }}>てん</span>
              </div>
            </div>
            <div style={{ fontSize:20, fontWeight:700, color:'#6B6B6B', marginBottom:40 }}>{g.correct}もん せいかい / {total}もん</div>
            <button onClick={startGame} style={{
              ...bs, fontSize:24, fontWeight:900, color:'white',
              background:'#E8652E', border:'none',
              padding:'22px 48px', borderRadius:60,
              boxShadow:'0 6px 20px rgba(232,101,46,0.3)',
            }}>もういちど</button>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
