    draw: (lv) => (
      <svg viewBox="0 0 200 200" width="100%" height="100%">

        {lv >= 2 && <circle cx="100" cy="90" r="35" fill="none" stroke="#388E3C" strokeWidth="3" />}
        {lv >= 3 && <circle cx="80" cy="80" r="25" fill="none" stroke="#388E3C" strokeWidth="3" />}
        {lv >= 4 && <circle cx="120" cy="85" r="22" fill="none" stroke="#388E3C" strokeWidth="3" />}
        {lv >= 5 && <>

          <circle cx="100" cy="90" r="35" fill="#43A047" />

  {

    draw: (lv) => (

        {lv >= 3 && <line x1="100" y1="100" x2="130" y2="100" stroke="#E53935" strokeWidth="2" strokeLinecap="round" />}
        {lv >= 4 && <>
          {[12,3,6,9].map((n,i) => {

        {lv >= 3 && <line x1="145" y1="90" x2="145" y2="110" stroke="#F9A825" strokeWidth="3" strokeLinecap="round" />}

          <path d="M 95 68 Q 100 42, 110 58" fill="none" stroke="#5D4037" strokeWidth="4" strokeLinecap="round" />

const DIFF = {
  easy:   { label:'かんたん', emoji:'🌱', desc:'ヒント多め・8問', rounds:8, startLevel:3 },
  normal: { label:'ふつう', emoji:'🌿', desc:'少しずつ見える・10問', rounds:10, startLevel:2 },
  hard:   { label:'むずかしい', emoji:'🌳', desc:'最小ヒント・10問', rounds:10, startLevel:1 },
};

function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function App() {
  const [screen, setScreen] = React.useState('select');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [history, setHistory] = React.useState([]);
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  const g = React.useRef({
    phase: 'idle',
    items: [],
    currentIdx: 0,
    revealLevel: 1,
    score: 0,
    correct: 0,
    guessed: false,
    feedback: null,
    selected: null,
    results: [],
    options: [],
  }).current;

  const startGame = (diff) => {
    setDifficulty(diff);
    const cfg = DIFF[diff];
    g.items = shuffle(ITEMS).slice(0, cfg.rounds);
    g.currentIdx = 0;
    g.score = 0;
    g.correct = 0;
    g.results = [];
    setShowConfetti(false);
    setScreen('game');
    setupQuestion(0, diff);
  };

  const setupQuestion = (idx, diff) => {
    const cfg = DIFF[diff || difficulty];
    g.currentIdx = idx;
    g.revealLevel = cfg.startLevel;
    g.guessed = false;
    g.feedback = null;
    g.selected = null;

    // Generate options: correct + 3 wrong
    const correct = g.items[idx];
    const others = shuffle(ITEMS.filter(it => it.id !== correct.id)).slice(0, 3);
    g.options = shuffle([correct, ...others]);
    g.phase = 'guessing';
    rerender();
  };

  const revealMore = () => {
    if (g.revealLevel >= 5 || g.guessed) return;
    g.revealLevel++;
    rerender();
  };

  const handleGuess = (item) => {
    if (g.guessed) return;
    g.guessed = true;
    g.selected = item;
    const correct = g.items[g.currentIdx];
    const isCorrect = item.id === correct.id;
    // More points for guessing with less revealed
    const bonus = Math.max(0, (6 - g.revealLevel) * 5);
    if (isCorrect) { g.score += 10 + bonus; g.correct++; }
    g.feedback = isCorrect ? 'correct' : 'wrong';
    g.revealLevel = 5; // Reveal fully
    g.results.push({ item: correct, guessedAt: g.revealLevel, correct: isCorrect, selected: item });
    rerender();
  };

  const nextQuestion = () => {
    if (g.currentIdx + 1 >= g.items.length) finishGame();
    else setupQuestion(g.currentIdx + 1, difficulty);
  };

  const finishGame = () => {
    g.phase = 'result'; rerender();
    const pct = g.correct / g.items.length;
    if (pct >= 0.8) { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 4000); }
    setHistory(prev => [{ diff: difficulty, correct: g.correct, total: g.items.length, score: g.score, date: new Date().toISOString() }, ...prev].slice(0, 20));
    setScreen('result');
  };

  const goBack = () => { g.phase = 'idle'; setScreen('select'); rerender(); };

  const cfg = DIFF[difficulty] || DIFF.normal;
  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };

  const ConfettiEl = showConfetti ? (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:999, overflow:'hidden' }}>
      <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`}</style>
      {Array.from({length:50},(_,i) => (
        <div key={i} style={{ position:'absolute', top:-10, left:Math.random()*100+'%', width:6+Math.random()*8, height:6+Math.random()*8, background:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], borderRadius:Math.random()>0.5?'50%':2, animation:`cf ${2+Math.random()*2}s linear ${Math.random()*1.5}s forwards` }} />
      ))}
    </div>
  ) : null;

  return (
    <div style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF7', minHeight:'100vh', color:'#2D2D2D' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px', borderRadius:8}}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#FF6B35' }}>🔍 これなーんだ？</span>
        </div>
        {screen === 'game' && (
          <div style={{ display:'flex', gap:6 }}>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#2EC4B6', padding:'3px 10px', borderRadius:50 }}>{g.currentIdx+1}/{g.items.length}</span>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#FF6B35', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
          </div>
        )}
      </div>

      {/* ===== SELECT ===== */}
      {screen === 'select' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16, animation:'bounce 2s infinite' }}>🔍</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:6 }}>これなーんだ？</div>
          <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:8, lineHeight:1.7 }}>少しずつ見えてくる絵を<br/>いち早く当てよう！</div>
          <div style={{ fontSize:12, color:'#9E9E9E', marginBottom:28, background:'#FFF3E0', padding:'8px 16px', borderRadius:12 }}>🧠 視覚認知・プライミング記憶のトレーニングです</div>

          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'18px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'left' }}>
            <div style={{ fontSize:14, fontWeight:700, marginBottom:12 }}>🎯 遊び方</div>
            <div style={{ fontSize:13, color:'#6B6B6B', lineHeight:2 }}>
              ① 絵の一部がチラッと見えます<br/>
              ② わかったら4択から選んでください<br/>
              ③ わからなければ「もう少し見る」で追加ヒント<br/>
              ④ 早く当てるほど高得点！
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420 }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度を選んでスタート</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {Object.entries(DIFF).map(([k,d]) => (
                <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'3px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left'}}>
                  <span style={{ fontSize:26 }}>{d.emoji}</span>
                  <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
                </button>
              ))}
            </div>
          </div>

          {history.length > 0 && (
            <div style={{ width:'100%', maxWidth:420, marginTop:28, textAlign:'left' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
              {history.slice(0,5).map((h,i) => {
                const hc = DIFF[h.diff]; const d = new Date(h.date);
                return (
                  <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                      <div><div style={{fontSize:12,fontWeight:700}}>{hc.label}・{h.correct}/{h.total}正解</div><div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div></div>
                    </div>
                    <div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#FF6B35'}}>{h.score}pt</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ===== GAME ===== */}
      {screen === 'game' && g.phase === 'guessing' && (() => {
        const item = g.items[g.currentIdx];
        const correct = g.items[g.currentIdx];

        return (
          <div style={{ padding:'0 16px', maxWidth:500, margin:'0 auto' }}>
            {/* Status */}
            <div style={{ display:'flex', justifyContent:'center', gap:20, padding:'12px 16px', background:'white', borderBottom:'1px solid #F0F0F0', borderRadius:'0 0 16px 16px', marginBottom:8 }}>
              {[{v:g.score,l:'スコア',c:'#FF6B35'},{v:g.correct+'/'+(g.currentIdx+(g.guessed?1:0)),l:'正解',c:'#2EC4B6'},{v:(g.currentIdx+1)+'/'+g.items.length,l:'問題',c:'#7B1FA2'}].map((s,i) => (
                <div key={i} style={{ textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:s.c }}>{s.v}</div>
                  <div style={{ fontSize:9, color:'#9E9E9E', marginTop:2 }}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Progress */}
            <div style={{ display:'flex', gap:3, marginBottom:12 }}>
              {g.items.map((_,i) => (
                <div key={i} style={{ flex:1, height:5, borderRadius:3, background: i < g.results.length ? (g.results[i].correct ? '#66BB6A' : '#EF5350') : i === g.currentIdx ? '#FFB74D' : '#E8E8E8' }} />
              ))}
            </div>

            {/* Drawing area */}
            <div style={{ background:'white', borderRadius:20, padding:20, boxShadow:'0 4px 24px rgba(0,0,0,0.06)', marginBottom:14, animation:'fadeUp 0.4s ease-out' }} key={g.currentIdx + '-' + g.revealLevel}>
              <div style={{ width:200, height:200, margin:'0 auto' }}>
                {item.draw(g.revealLevel)}
              </div>

              {/* Reveal level indicator */}
              <div style={{ display:'flex', gap:6, justifyContent:'center', marginTop:12 }}>
                {[1,2,3,4,5].map(lv => (
                  <div key={lv} style={{
                    width:28, height:6, borderRadius:3,
                    background: lv <= g.revealLevel ? '#FF6B35' : '#E0E0E0',
                    transition:'background 0.3s',
                  }} />
                ))}
              </div>
              <div style={{ fontSize:10, color:'#9E9E9E', textAlign:'center', marginTop:6 }}>
                ヒントレベル {g.revealLevel}/5
              </div>
            </div>

            {/* Reveal more button */}
            {!g.guessed && g.revealLevel < 5 && (
              <button onClick={revealMore} style={{...btnBase, width:'100%', fontSize:14, fontWeight:700, padding:'12px', borderRadius:50, border:'2px solid #FFE0B2', background:'#FFF3E0', color:'#E65100', marginBottom:10 }}>
                🔍 もう少し見る（ヒント追加）
              </button>
            )}

            {/* Options */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10 }}>
              {g.options.map((opt, i) => {
                const isSelected = g.selected && g.selected.id === opt.id;
                const isCorrect = opt.id === correct.id;
                const answered = g.guessed;
                return (
                  <button key={opt.id} onClick={() => handleGuess(opt)} disabled={answered}
                    style={{
                      ...btnBase, padding:'16px 12px', borderRadius:16, textAlign:'center',
                      border:`3px solid ${answered&&isCorrect?'#66BB6A':answered&&isSelected&&!isCorrect?'#EF5350':'#E8E8E8'}`,
                      background:answered&&isCorrect?'#E8F5E9':answered&&isSelected&&!isCorrect?'#FFEBEE':'white',
                      opacity:answered&&!isCorrect&&!isSelected?0.4:1,
                    }}>
                    <div style={{ fontSize:13, fontWeight:700, color:answered&&isCorrect?'#2E7D32':answered&&isSelected&&!isCorrect?'#C62828':'#2D2D2D' }}>
                      {opt.label}
                    </div>
                    <div style={{ fontSize:10, color:'#9E9E9E', marginTop:2 }}>{opt.category}</div>
                    {answered && isCorrect && <div style={{ fontSize:12, marginTop:4 }}>✅</div>}
                  </button>
                );
              })}
            </div>

            {/* Feedback + Next */}
            {g.feedback && (
              <div style={{ textAlign:'center', marginTop:14, animation:'fadeUp 0.3s ease-out' }}>
                <div style={{ fontSize:16, fontWeight:900, color:g.feedback==='correct'?'#2E7D32':'#C62828' }}>
                  {g.feedback === 'correct' ? '✅ 正解！' : `❌ 正解は「${correct.label}」でした`}
                </div>
                <button onClick={nextQuestion} style={{...btnBase, marginTop:10, fontSize:15, fontWeight:700, padding:'14px 32px', borderRadius:50, background:g.feedback==='correct'?'#66BB6A':'#FF6B35', border:'none', color:'white'}}>
                  {g.currentIdx+1 >= g.items.length ? '結果を見る →' : '次の問題へ →'}
                </button>
              </div>
            )}

            <div style={{ height:24 }} />
          </div>
        );
      })()}

      {/* ===== RESULT ===== */}
      {screen === 'result' && (() => {
        const total = g.items.length;
        const pct = total > 0 ? g.correct / total : 0;
        const stars = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.55 ? '⭐⭐' : '⭐';
        const msg = pct >= 0.85 ? 'すばらしい認知力！' : pct >= 0.55 ? 'よくできました！' : 'もう一度挑戦！';

        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'30px 20px', textAlign:'center' }}>
            <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:4, animation:'fadeUp 0.6s ease-out 0.1s both' }}>{msg}</div>
            <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:24, animation:'fadeUp 0.6s ease-out 0.2s both' }}>{cfg.label}モード</div>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:24, animation:'fadeUp 0.6s ease-out 0.3s both' }}>
              {[{v:`${g.correct}/${total}`,l:'正解数'},{v:Math.round(pct*100)+'%',l:'正答率'},{v:g.score,l:'スコア'}].map((s,i) =>
                <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:24, fontWeight:800, color:'#FF6B35' }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
                </div>
              )}
            </div>

            {/* Review with mini drawings */}
            <div style={{ width:'100%', maxWidth:420, marginBottom:28, animation:'fadeUp 0.6s ease-out 0.35s both' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📋 回答の振り返り</div>
              {g.results.map((r, i) => (
                <div key={i} style={{
                  background:r.correct?'#F1F8E9':'#FFF3E0', borderRadius:12, padding:'10px 14px',
                  marginBottom:6, borderLeft:`4px solid ${r.correct?'#66BB6A':'#FF6B35'}`,
                  display:'flex', alignItems:'center', gap:10,
                }}>
                  <div style={{ width:48, height:48, flexShrink:0 }}>{r.item.draw(5)}</div>
                  <div style={{ flex:1, textAlign:'left' }}>
                    <div style={{ fontSize:16, fontWeight:700 }}>
                      {r.correct ? '✅' : '❌'} {r.item.label}
                    </div>
                    {!r.correct && <div style={{ fontSize:11, color:'#E65100' }}>選んだ: {r.selected.label}</div>}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300, animation:'fadeUp 0.6s ease-out 0.4s both' }}>
              <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60}}>もう一度プレイ 🔄</button>
              <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60}}>設定を変える</button>
            </div>
          </div>
        );
      })()}

      {ConfettiEl}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
