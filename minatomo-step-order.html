const DIFF = {
  easy:   { label:'かんたん', emoji:'🌱', desc:'5ステップ・6問', rounds:6 },
  normal: { label:'ふつう', emoji:'🌿', desc:'6〜7ステップ・6問', rounds:6 },
  hard:   { label:'むずかしい', emoji:'🌳', desc:'8〜9ステップ・4問', rounds:4 },
};

function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function App() {
  const [screen, setScreen] = React.useState('select');
  const [difficulty, setDifficulty] = React.useState('normal');
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [history, setHistory] = React.useState([]);
  const [, forceUpdate] = React.useState(0);
  const rerender = () => forceUpdate(x => x + 1);

  // Drag state
  const [dragIdx, setDragIdx] = React.useState(null);
  const [dragOverIdx, setDragOverIdx] = React.useState(null);
  const [dragY, setDragY] = React.useState(0);
  const containerRef = React.useRef(null);
  const rootRef = React.useRef(null);
  const touchStartY = React.useRef(0);
  const dragState = React.useRef({ dragging: false, idx: null, overIdx: null, y: 0 });

  const g = React.useRef({
    phase: 'idle',
    sequences: [],
    currentSeq: 0,
    correctOrder: [],
    playerOrder: [],
    score: 0,
    correct: 0,
    submitted: false,
    feedback: null,
    results: [],
  }).current;

  const startGame = (diff) => {
    setDifficulty(diff);
    const cfg = DIFF[diff];
    const pool = SEQUENCES[diff] || SEQUENCES.easy;
    g.sequences = shuffle(pool).slice(0, cfg.rounds);
    g.currentSeq = 0;
    g.score = 0;
    g.correct = 0;
    g.results = [];
    setShowConfetti(false);
    setScreen('game');
    setupRound(0);
  };

  const setupRound = (idx) => {
    const seq = g.sequences[idx];
    g.correctOrder = [...seq.steps];
    g.playerOrder = shuffle([...seq.steps]);
    g.submitted = false;
    g.feedback = null;
    g.phase = 'playing';
    setDragIdx(null);
    setDragOverIdx(null);
    rerender();
  };

  // ===== DRAG HANDLERS =====
  const getDropIndex = React.useCallback((clientY) => {
    if (!containerRef.current) return null;
    const items = containerRef.current.querySelectorAll('[data-step-idx]');
    for (let i = 0; i < items.length; i++) {
      const rect = items[i].getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      if (clientY < midY) return i;
    }
    return items.length;
  }, []);

  const finishDrag = React.useCallback(() => {
    const ds = dragState.current;
    if (!ds.dragging || ds.idx === null || ds.overIdx === null) {
      ds.dragging = false; ds.idx = null; ds.overIdx = null;
      setDragIdx(null); setDragOverIdx(null);
      return;
    }
    const arr = [...g.playerOrder];
    const [item] = arr.splice(ds.idx, 1);
    const insertAt = ds.overIdx > ds.idx ? ds.overIdx - 1 : ds.overIdx;
    arr.splice(insertAt, 0, item);
    g.playerOrder = arr;
    ds.dragging = false; ds.idx = null; ds.overIdx = null;
    setDragIdx(null); setDragOverIdx(null);
    rerender();
  }, []);

  const startDrag = React.useCallback((idx, clientY) => {
    if (g.submitted) return;
    dragState.current = { dragging: true, idx, overIdx: idx, y: clientY };
    setDragIdx(idx);
    setDragY(clientY);
  }, []);

  // Register non-passive touch listeners on document
  React.useEffect(() => {
    const onTouchMove = (e) => {
      const ds = dragState.current;
      if (!ds.dragging) return;
      e.preventDefault(); // This works because listener is non-passive
      e.stopPropagation();
      const touch = e.touches[0];
      ds.y = touch.clientY;
      setDragY(touch.clientY);
      const overIdx = getDropIndex(touch.clientY);
      if (overIdx !== null) { ds.overIdx = overIdx; setDragOverIdx(overIdx); }
    };
    const onTouchEnd = () => { finishDrag(); };
    const onMouseMove = (e) => {
      const ds = dragState.current;
      if (!ds.dragging) return;
      e.preventDefault();
      ds.y = e.clientY;
      setDragY(e.clientY);
      const overIdx = getDropIndex(e.clientY);
      if (overIdx !== null) { ds.overIdx = overIdx; setDragOverIdx(overIdx); }
    };
    const onMouseUp = () => { finishDrag(); };

    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onTouchEnd);
    document.addEventListener('touchcancel', onTouchEnd);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);

    return () => {
      document.removeEventListener('touchmove', onTouchMove);
      document.removeEventListener('touchend', onTouchEnd);
      document.removeEventListener('touchcancel', onTouchEnd);
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    };
  }, [getDropIndex, finishDrag]);

  const submitOrder = () => {
    if (g.submitted) return;
    g.submitted = true;
    g.feedback = 'checking';
    rerender();

    setTimeout(() => {
      const isCorrect = g.playerOrder.every((s, i) => s === g.correctOrder[i]);
      const correctPositions = g.playerOrder.filter((s, i) => s === g.correctOrder[i]).length;
      const total = g.correctOrder.length;

      if (isCorrect) {
        g.score += total * 10;
        g.correct++;
        g.feedback = 'correct';
      } else {
        g.score += Math.round(correctPositions * 3);
        g.feedback = 'wrong';
      }
      g.results.push({ seq: g.sequences[g.currentSeq], playerOrder: [...g.playerOrder], correctPositions, total, isCorrect });
      rerender();
    }, 600);
  };

  const nextRound = () => {
    if (g.currentSeq + 1 >= g.sequences.length) { finishGame(); }
    else { g.currentSeq++; setupRound(g.currentSeq); }
  };

  const finishGame = () => {
    g.phase = 'result'; rerender();
    const pct = g.correct / g.sequences.length;
    if (pct >= 0.8) { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 4000); }
    setHistory(prev => [{ diff: difficulty, correct: g.correct, total: g.sequences.length, score: g.score, date: new Date().toISOString() }, ...prev].slice(0, 20));
    setScreen('result');
  };

  const goBack = () => { g.phase = 'idle'; setScreen('select'); rerender(); };

  const cfg = DIFF[difficulty] || DIFF.normal;
  const btnBase = { fontFamily:"'Zen Maru Gothic',sans-serif", cursor:'pointer', transition:'all 0.2s' };
  const currentSeqData = g.sequences[g.currentSeq];

  const ConfettiEl = showConfetti ? (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:999, overflow:'hidden' }}>
      <style>{`@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`}</style>
      {Array.from({length:50},(_,i) => (
        <div key={i} style={{ position:'absolute', top:-10, left:Math.random()*100+'%', width:6+Math.random()*8, height:6+Math.random()*8, background:['#FF6B35','#2EC4B6','#F9A825','#AB47BC','#66BB6A','#FF8F5E'][i%6], borderRadius:Math.random()>0.5?'50%':2, animation:`cf ${2+Math.random()*2}s linear ${Math.random()*1.5}s forwards` }} />
      ))}
    </div>
  ) : null;

  return (
    <div ref={rootRef} style={{ fontFamily:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif", background:'#FAFAF7', minHeight:'100vh', color:'#2D2D2D' }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap');
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      `}</style>

      {/* TOP BAR */}
      <div style={{ background:'white', padding:'12px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {screen !== 'select' && <button onClick={goBack} style={{...btnBase, fontSize:20, background:'none', border:'none', color:'#6B6B6B', padding:'4px 8px', borderRadius:8}}>←</button>}
          <span style={{ fontSize:16, fontWeight:900, color:'#FF6B35' }}>🧩 手順ならべ</span>
        </div>
        {screen === 'game' && (
          <div style={{ display:'flex', gap:6 }}>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#2EC4B6', padding:'3px 10px', borderRadius:50 }}>{g.currentSeq+1}/{g.sequences.length}</span>
            <span style={{ fontSize:12, fontWeight:700, color:'white', background:'#FF6B35', padding:'3px 10px', borderRadius:50 }}>{cfg.label}</span>
          </div>
        )}
      </div>

      {/* ===== SELECT ===== */}
      {screen === 'select' && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16, animation:'bounce 2s infinite' }}>🧩</div>
          <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:6 }}>手順ならべ</div>
          <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:8, lineHeight:1.7 }}>バラバラの手順を<br/>正しい順番に並べ替えよう！</div>

          <div style={{ width:'100%', maxWidth:420, marginBottom:24, background:'white', borderRadius:16, padding:'18px 16px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'left' }}>
            <div style={{ fontSize:14, fontWeight:700, marginBottom:12 }}>🎯 遊び方</div>
            <div style={{ fontSize:13, color:'#6B6B6B', lineHeight:2 }}>
              ① 日常の動作手順がバラバラに表示されます<br/>
              ② ドラッグして正しい順番に並べ替えてください<br/>
              ③ 並べ終わったら「決定！」を押します<br/>
              ④ 全ステップ正しい位置ならクリア！
            </div>
          </div>

          <div style={{ width:'100%', maxWidth:420 }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📊 難易度を選んでスタート</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {Object.entries(DIFF).map(([k,d]) => (
                <button key={k} onClick={() => startGame(k)} style={{...btnBase, fontSize:15, fontWeight:700, padding:'18px 20px', borderRadius:16, border:'3px solid #E8E8E8', background:'white', display:'flex', alignItems:'center', gap:14, textAlign:'left'}}>
                  <span style={{ fontSize:26 }}>{d.emoji}</span>
                  <div><div style={{ fontSize:15, fontWeight:700 }}>{d.label}</div><div style={{ fontSize:11, color:'#6B6B6B', marginTop:2 }}>{d.desc}</div></div>
                </button>
              ))}
            </div>
          </div>

          {history.length > 0 && (
            <div style={{ width:'100%', maxWidth:420, marginTop:28, textAlign:'left' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10 }}>📊 プレイ履歴</div>
              {history.slice(0,5).map((h,i) => {
                const hc = DIFF[h.diff]; const d = new Date(h.date);
                return (
                  <div key={i} style={{ background:'white', borderRadius:16, padding:'12px 14px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, background:h.diff==='easy'?'#E8F5E9':h.diff==='normal'?'#FFF3E0':'#FCE4EC' }}>{hc.emoji}</div>
                      <div><div style={{fontSize:12,fontWeight:700}}>{hc.label}・{h.correct}/{h.total}完全正解</div><div style={{fontSize:10,color:'#9E9E9E'}}>{d.getMonth()+1}/{d.getDate()} {d.getHours()}:{String(d.getMinutes()).padStart(2,'0')}</div></div>
                    </div>
                    <div style={{fontFamily:'Outfit',fontSize:16,fontWeight:800,color:'#FF6B35'}}>{h.score}pt</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ===== GAME ===== */}
      {screen === 'game' && g.phase === 'playing' && currentSeqData && (
        <div style={{ padding:'0 16px', maxWidth:500, margin:'0 auto', userSelect:'none', WebkitUserSelect:'none', touchAction: dragIdx !== null ? 'none' : 'auto', overscrollBehavior:'none' }}>
          {/* Status */}
          <div style={{ display:'flex', justifyContent:'center', gap:20, padding:'12px 16px', background:'white', borderBottom:'1px solid #F0F0F0', borderRadius:'0 0 16px 16px', marginBottom:8 }}>
            {[
              { v:g.score, l:'スコア', c:'#FF6B35' },
              { v:g.correct+'/'+(g.currentSeq+(g.submitted?1:0)), l:'完全正解', c:'#2EC4B6' },
              { v:(g.currentSeq+1)+'/'+g.sequences.length, l:'問題', c:'#7B1FA2' },
            ].map((s,i) => (
              <div key={i} style={{ textAlign:'center' }}>
                <div style={{ fontFamily:'Outfit', fontSize:18, fontWeight:800, color:s.c }}>{s.v}</div>
                <div style={{ fontSize:9, color:'#9E9E9E', marginTop:2 }}>{s.l}</div>
              </div>
            ))}
          </div>

          {/* Progress */}
          <div style={{ display:'flex', gap:3, marginBottom:12 }}>
            {g.sequences.map((_, i) => (
              <div key={i} style={{ flex:1, height:5, borderRadius:3, background: i < g.results.length ? (g.results[i].isCorrect ? '#66BB6A' : '#EF5350') : i === g.currentSeq ? '#FFB74D' : '#E8E8E8' }} />
            ))}
          </div>

          {/* Task title */}
          <div style={{ background:'white', borderRadius:16, padding:'16px 20px', boxShadow:'0 2px 12px rgba(0,0,0,0.04)', marginBottom:12, textAlign:'center', animation:'fadeUp 0.4s ease-out' }} key={g.currentSeq}>
            <div style={{ fontSize:36, marginBottom:8 }}>{currentSeqData.icon}</div>
            <div style={{ fontSize:18, fontWeight:900, color:'#FF6B35' }}>「{currentSeqData.title}」</div>
            <div style={{ fontSize:12, color:'#9E9E9E', marginTop:4 }}>
              {g.submitted ? '' : '☝️ ドラッグして正しい順番に並べ替えてください'}
            </div>
          </div>

          {/* Draggable steps */}
          <div ref={containerRef} style={{ display:'flex', flexDirection:'column', gap:6, marginBottom:16, position:'relative' }}>
            {g.playerOrder.map((step, i) => {
              const correctIdx = g.correctOrder.indexOf(step);
              const isCorrectPos = g.submitted && correctIdx === i;
              const isWrongPos = g.submitted && correctIdx !== i;
              const isDragging = dragIdx === i;
              const isDropTarget = !g.submitted && dragOverIdx !== null && dragIdx !== null && (
                (dragOverIdx <= i && dragIdx > i) || (dragOverIdx > i && dragIdx < i) || dragOverIdx === i
              );

              return (
                <div key={step + '-' + g.currentSeq} data-step-idx={i}>
                  {/* Drop indicator line */}
                  {!g.submitted && dragOverIdx === i && dragIdx !== null && dragIdx !== i && (
                    <div style={{ height:4, background:'#FF6B35', borderRadius:2, marginBottom:4, animation:'fadeUp 0.15s ease-out' }} />
                  )}

                  <div
                    onMouseDown={(e) => { e.preventDefault(); startDrag(i, e.clientY); }}
                    onTouchStart={(e) => { e.preventDefault(); startDrag(i, e.touches[0].clientY); }}
                    style={{
                      display:'flex', alignItems:'center', gap:8,
                      padding:'14px 14px', borderRadius:14,
                      background: isCorrectPos ? '#E8F5E9' : isWrongPos ? '#FFEBEE' : isDragging ? '#FFF3E0' : 'white',
                      border: `2px solid ${isCorrectPos ? '#66BB6A' : isWrongPos ? '#EF5350' : isDragging ? '#FF6B35' : '#E8E8E8'}`,
                      opacity: isDragging ? 0.5 : 1,
                      transform: isDragging ? 'scale(0.98)' : 'scale(1)',
                      transition: isDragging ? 'none' : 'all 0.2s',
                      cursor: g.submitted ? 'default' : 'grab',
                      touchAction: 'none',
                    }}>
                    {/* Drag handle */}
                    {!g.submitted && (
                      <div style={{ fontSize:16, color:'#BDBDBD', flexShrink:0, cursor:'grab', padding:'0 4px' }}>☰</div>
                    )}

                    {/* Number */}
                    <div style={{
                      width:30, height:30, borderRadius:'50%', flexShrink:0,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontFamily:'Outfit', fontSize:18, fontWeight:800,
                      background: isCorrectPos ? '#66BB6A' : isWrongPos ? '#EF5350' : '#FF6B35',
                      color:'white',
                    }}>{i + 1}</div>

                    {/* Step text */}
                    <div style={{ flex:1, fontSize:14, fontWeight:600, color: isCorrectPos ? '#2E7D32' : isWrongPos ? '#C62828' : '#2D2D2D' }}>
                      {step}
                    </div>

                    {isWrongPos && <div style={{ fontSize:10, fontWeight:700, color:'#EF5350', flexShrink:0 }}>→{correctIdx+1}番目</div>}
                    {isCorrectPos && <div style={{ fontSize:16, flexShrink:0 }}>✅</div>}
                  </div>
                </div>
              );
            })}

            {/* Drop indicator at end */}
            {!g.submitted && dragOverIdx === g.playerOrder.length && dragIdx !== null && (
              <div style={{ height:4, background:'#FF6B35', borderRadius:2, marginTop:2 }} />
            )}
          </div>

          {/* Floating dragged item */}
          {dragIdx !== null && !g.submitted && (
            <div style={{
              position:'fixed', left:20, right:20, maxWidth:468, margin:'0 auto',
              top: dragY - 30, zIndex:100, pointerEvents:'none',
              padding:'14px 14px', borderRadius:14,
              background:'#FF6B35', color:'white', fontWeight:700, fontSize:14,
              boxShadow:'0 8px 32px rgba(255,107,53,0.4)',
              display:'flex', alignItems:'center', gap:8,
              transform:'scale(1.03)', opacity:0.95,
            }}>
              <div style={{ width:30, height:30, borderRadius:'50%', background:'rgba(255,255,255,0.3)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Outfit', fontWeight:800 }}>{dragIdx+1}</div>
              {g.playerOrder[dragIdx]}
            </div>
          )}

          {/* Submit button */}
          {!g.submitted && (
            <button onClick={submitOrder} style={{
              ...btnBase, width:'100%', fontSize:16, fontWeight:700,
              padding:'16px', borderRadius:50, border:'none',
              background:'linear-gradient(135deg, #FF6B35, #FF8F5E)',
              color:'white', boxShadow:'0 4px 16px rgba(255,107,53,0.3)',
            }}>この順番で決定！ ✨</button>
          )}

          {g.feedback === 'checking' && (
            <div style={{ textAlign:'center', padding:16, fontSize:16, fontWeight:700, color:'#7B1FA2' }}>🔍 チェック中...</div>
          )}
          {g.feedback === 'correct' && (
            <div style={{ textAlign:'center', padding:16, animation:'fadeUp 0.3s ease-out' }}>
              <div style={{ fontSize:36, marginBottom:4 }}>🎉</div>
              <div style={{ fontSize:18, fontWeight:900, color:'#2E7D32' }}>完璧な順番です！</div>
              <button onClick={nextRound} style={{...btnBase, marginTop:12, fontSize:15, fontWeight:700, padding:'14px 32px', borderRadius:50, background:'#66BB6A', border:'none', color:'white'}}>
                {g.currentSeq+1 >= g.sequences.length ? '結果を見る →' : '次の問題へ →'}
              </button>
            </div>
          )}
          {g.feedback === 'wrong' && (
            <div style={{ textAlign:'center', padding:16, animation:'fadeUp 0.3s ease-out' }}>
              <div style={{ fontSize:36, marginBottom:4 }}>🤔</div>
              <div style={{ fontSize:16, fontWeight:900, color:'#E65100', marginBottom:4 }}>おしい！</div>
              <div style={{ fontSize:13, color:'#6B6B6B' }}>{g.results[g.results.length-1]?.correctPositions}/{g.results[g.results.length-1]?.total} ステップが正しい位置でした</div>
              <div style={{ marginTop:12, padding:'12px 16px', background:'#FFF3E0', borderRadius:12, textAlign:'left' }}>
                <div style={{ fontSize:11, fontWeight:700, color:'#E65100', marginBottom:8 }}>正しい順番：</div>
                {g.correctOrder.map((s, i) => (
                  <div key={i} style={{ fontSize:12, color:'#6B6B6B', padding:'4px 0', display:'flex', gap:8 }}>
                    <span style={{ fontFamily:'Outfit', fontWeight:800, color:'#FF6B35', width:20, flexShrink:0 }}>{i+1}</span><span>{s}</span>
                  </div>
                ))}
              </div>
              <button onClick={nextRound} style={{...btnBase, marginTop:12, fontSize:15, fontWeight:700, padding:'14px 32px', borderRadius:50, background:'#FF6B35', border:'none', color:'white'}}>
                {g.currentSeq+1 >= g.sequences.length ? '結果を見る →' : '次の問題へ →'}
              </button>
            </div>
          )}

          <div style={{ height:24 }} />
        </div>
      )}

      {/* ===== RESULT ===== */}
      {screen === 'result' && (() => {
        const total = g.sequences.length;
        const pct = total > 0 ? g.correct / total : 0;
        const stars = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.5 ? '⭐⭐' : '⭐';
        const msg = pct >= 0.85 ? 'すばらしい段取り力！' : pct >= 0.5 ? 'よくできました！' : 'もう一度挑戦！';
        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'30px 20px', textAlign:'center' }}>
            <div style={{ fontSize:48, marginBottom:16, animation:'fadeUp 0.6s ease-out' }}>{stars}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#FF6B35', marginBottom:4, animation:'fadeUp 0.6s ease-out 0.1s both' }}>{msg}</div>
            <div style={{ fontSize:14, color:'#6B6B6B', marginBottom:24, animation:'fadeUp 0.6s ease-out 0.2s both' }}>{cfg.label}モード</div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:'100%', maxWidth:360, marginBottom:24, animation:'fadeUp 0.6s ease-out 0.3s both' }}>
              {[{v:`${g.correct}/${total}`,l:'完全正解'},{v:Math.round(pct*100)+'%',l:'正答率'},{v:g.score,l:'スコア'}].map((s,i) =>
                <div key={i} style={{ background:'white', borderRadius:16, padding:'14px 8px', boxShadow:'0 4px 20px rgba(0,0,0,0.06)', textAlign:'center' }}>
                  <div style={{ fontFamily:'Outfit', fontSize:24, fontWeight:800, color:'#FF6B35' }}>{s.v}</div>
                  <div style={{ fontSize:10, color:'#9E9E9E', marginTop:4 }}>{s.l}</div>
                </div>
              )}
            </div>
            <div style={{ width:'100%', maxWidth:420, marginBottom:28, animation:'fadeUp 0.6s ease-out 0.35s both' }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#6B6B6B', marginBottom:10, textAlign:'left' }}>📋 結果の振り返り</div>
              {g.results.map((r, i) => (
                <div key={i} style={{ background:r.isCorrect?'#E8F5E9':'#FFF3E0', borderRadius:12, padding:'12px 14px', marginBottom:6, borderLeft:`4px solid ${r.isCorrect?'#66BB6A':'#FF6B35'}`, textAlign:'left', display:'flex', alignItems:'center', gap:10 }}>
                  <span style={{ fontSize:24 }}>{r.seq.icon}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:16, fontWeight:700 }}>{r.seq.title}</div>
                    <div style={{ fontSize:11, color:r.isCorrect?'#2E7D32':'#E65100', marginTop:2 }}>{r.isCorrect ? '✅ 完全正解！' : `${r.correctPositions}/${r.total} 正しい位置`}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ width:'100%', maxWidth:420, marginBottom:24, padding:'14px 16px', background:'#F5F5F5', borderRadius:12, textAlign:'left', animation:'fadeUp 0.6s ease-out 0.4s both' }}>
              <div style={{ fontSize:12, fontWeight:700, color:'#6B6B6B', marginBottom:6 }}>💡 手順を考えるコツ</div>
              <div style={{ fontSize:11, color:'#9E9E9E', lineHeight:1.8 }}>まず「最初にやること」と「最後にやること」を決めると、間の順番が見えてきます。「これをやらないと次に進めない」という依存関係を考えましょう。</div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10, width:'100%', maxWidth:300, animation:'fadeUp 0.6s ease-out 0.45s both' }}>
              <button onClick={() => startGame(difficulty)} style={{...btnBase, fontSize:16, fontWeight:700, color:'white', background:'#FF6B35', border:'none', padding:'16px 32px', borderRadius:60}}>もう一度プレイ 🔄</button>
              <button onClick={goBack} style={{...btnBase, fontSize:14, fontWeight:700, color:'#6B6B6B', background:'white', border:'2px solid #E0E0E0', padding:'14px 32px', borderRadius:60}}>設定を変える</button>
            </div>
          </div>
        );
      })()}

      {ConfettiEl}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
